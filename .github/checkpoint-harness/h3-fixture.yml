# The T3.5 H3 hosted-proof fixture (production readiness log §3 H3): runs
# checkpoint CP95 of the harness tests on hosted runners, with live Claude
# sessions, fixture effects, an operational step in another repository root,
# two pull-request correction rounds and the fault input. It publishes to
# harness/<run> against the H3 implementation branch. Not a Checkpoint 1
# configuration.
repository:
  name: sb-dev/pactwright
  branch: ccr-60cac7b9-4pnn40
checkpoint: tools/checkpoint-harness/test/fixtures/checkpoint-harness/docs/checkpoints/95-hosted/checkpoint.yml
definitions:
  review: CP95 hosted fixture; authority T3.5 plan v4 §3 H3
roles:
  producer:
    adapter: claude-sdk
    model: claude-sonnet-5
    effort: medium
    skills: [karpathy-guidelines]
    skill_digests:
      karpathy-guidelines: sha256:6e22cc54cb02a5e98ae42d06d9d7292db0c1b43894831b32879beb0166b2aea7
    max_turns: 40
  reviewer:
    adapter: claude-sdk
    model: claude-opus-5-5
    effort: medium
    skills: [code-review-and-quality]
    skill_digests:
      code-review-and-quality: sha256:8f3cabca581bbf7cb5f0add3f7454e7a4523f9d4353a6a4a217e6fa515309612
    max_turns: 30
credentials:
  kind: oauth-token
  provider: env:CLAUDE_CODE_OAUTH_TOKEN
budgets:
  attempts: 4
  retries: 2
  wall_time_seconds: 900
  provider_spend_limit:
    usd: 2
    turn_reservation_usd: 0.25
  run_spend_usd: 40
permissions:
  writable: [tools/checkpoint-harness/test/fixtures/checkpoint-harness/hosted/work]
  scratch: []
  protected: []
  approvers:
    owner: [sb-dev]
    amend: [sb-dev]
    feedback: [sb-dev]
verification:
  bindings: tools/checkpoint-harness/test/fixtures/checkpoint-harness/hosted/bindings
publication:
  pull_request:
    title: "H3 hosted fixture: harness publication"
    draft: true
  # Each published head gets the repository's verification as its next review;
  # the live Claude job is left out of it.
  review:
    workflow: checkpoint-harness-verify.yml
    inputs:
      live: "false"
# CP95 Step 3 runs in the registry fixture: a repository root of its own,
# pinned at a revision of this repository that holds it.
operations:
  targets:
    registry:
      repository: sb-dev/pactwright
      revision: 5259bfd4e2d6d0f6a68f95076de26221b701f731
      path: tools/checkpoint-harness/test/fixtures/checkpoint-harness/registry
      writable: [RELEASES.md]
  steps:
    CP95-S03: registry
job:
  # Short, so the first jobs yield and continue automatically.
  yield_after_seconds: 240
  faults: true
