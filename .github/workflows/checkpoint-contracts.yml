name: Checkpoint contract validation

on:
  pull_request:
    paths:
      - ".github/workflows/checkpoint-contracts.yml"
      - "docs/checkpoints/**"
      - "docs/specs/**"
      - "tools/checkpoint-harness/src/checkpoint-contracts.ts"
      - "tools/checkpoint-harness/package.json"
      - "tools/checkpoint-harness/tsconfig.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".npmrc"
      - "tsconfig.json"

permissions:
  contents: read

concurrency:
  group: checkpoint-contracts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # The crosswalk quotes checkpoint prose from earlier revisions.
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Contract check
        run: pnpm contracts:check
