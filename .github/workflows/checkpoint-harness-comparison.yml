# Checkpoint harness comparison (T3.6 L4; evidence-backed learning log §4,
# L4-03): runs the pinned comparison protocol,
# tools/checkpoint-harness/test/comparison/protocol.yml, one GitHub-hosted job
# per task of the chosen set, with the claude-live environment's provider
# credential, then reports the pinned decision over every retained run. Its
# own workflow, so no other dispatch on the branch cancels a long run. It
# publishes nothing and grants no acceptance; candidate code runs only in the
# harness's containment, and the hidden oracle runs in the containment image
# without network. A pull request that changes the comparison only lists
# the protocol's tasks, with no secret.
name: Checkpoint harness comparison
run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && format('comparison {0}', inputs.set)
  || 'Checkpoint harness comparison check' }}

on:
  workflow_dispatch:
    inputs:
      set:
        description: The protocol set to run.
        required: true
        type: choice
        options: [tuning, held-out]
  pull_request:
    paths:
      - ".github/workflows/checkpoint-harness-comparison.yml"
      - "tools/checkpoint-harness/test/comparison/**"
      - "tools/checkpoint-harness/test/fixtures/checkpoint-harness/comparison/**"

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.event_name == 'workflow_dispatch' && format('checkpoint-harness-comparison-{0}', inputs.set)
    || format('checkpoint-harness-comparison-check-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tasks: ${{ steps.tasks.outputs.tasks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Tasks of the set
        id: tasks
        working-directory: tools/checkpoint-harness
        env:
          SET: ${{ inputs.set || 'held-out' }}
        run: |
          node --import tsx test/comparison/driver.ts --list --set tuning
          echo "tasks=$(node --import tsx test/comparison/driver.ts --list --set "$SET")" >> "$GITHUB_OUTPUT"

  run:
    needs: plan
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    environment: claude-live
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        task: ${{ fromJSON(needs.plan.outputs.tasks) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The baseline arm is a worktree of the protocol's baseline revision.
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Tested commit
        run: git rev-parse HEAD
      - name: Export the artifact runtime to the driver
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            core.setSecret(process.env.ACTIONS_RUNTIME_TOKEN);
            core.exportVariable("ACTIONS_RUNTIME_TOKEN", process.env.ACTIONS_RUNTIME_TOKEN);
            core.exportVariable("ACTIONS_RESULTS_URL", process.env.ACTIONS_RESULTS_URL);
      - name: Comparison
        working-directory: tools/checkpoint-harness
        env:
          SET: ${{ inputs.set }}
          TASK: ${{ matrix.task }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: >-
          node --import tsx test/comparison/driver.ts --set "$SET" --task "$TASK"
          --out "$RUNNER_TEMP/comparison/$TASK" --baseline "$RUNNER_TEMP/baseline-tree"
          --upload "comparison-$SET-$TASK"

  report:
    needs: [plan, run]
    if: always() && github.event_name == 'workflow_dispatch' && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Tested commit
        run: git rev-parse HEAD
      - name: Export the artifact runtime to the report
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            core.setSecret(process.env.ACTIONS_RUNTIME_TOKEN);
            core.exportVariable("ACTIONS_RUNTIME_TOKEN", process.env.ACTIONS_RUNTIME_TOKEN);
            core.exportVariable("ACTIONS_RESULTS_URL", process.env.ACTIONS_RESULTS_URL);
      - name: Report
        working-directory: tools/checkpoint-harness
        env:
          SET: ${{ inputs.set }}
        run: |
          node --import tsx test/comparison/report.ts --set "$SET" --in "$RUNNER_TEMP/results" --out "$RUNNER_TEMP/report" --download --upload "comparison-$SET-report"
          cat "$RUNNER_TEMP/report/report.md" >> "$GITHUB_STEP_SUMMARY"
