name: ci

on:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm lint

      # A9 — the transcription check. Sited as a STEP in `ci` deliberately: a check
      # name is the JOB id, so a new workflow or a new job would create a check that
      # is NOT required and would block nothing until an out-of-diff admin action.
      # `ci` is already required (docs/branch-protection.md), so only a step here is
      # enforced on merge day. Accepted costs, not claimed away: `ci`'s blast radius
      # grows, a transcription mismatch now blocks every merge, and this verdict
      # shares the `ci` check name with test/typecheck/lint — mitigated by the step
      # name, an ::error:: annotation and a step-summary block, never by weakening
      # the step to non-fatal.
      #
      # HONEST BOUND: this proves the recorded block is byte-identical to what the
      # resolver produces for the recorded graph, and that spec:status runs against
      # the live graph. It does NOT prove a human ran spec:status when they wrote the
      # block — a hand-typed byte-equal block passes. Closing that needs a run stamp
      # or digest; this change does not take it, and adding one is a follow-up intent
      # under rule 5, never a silent addition.
      #
      # FIXTURE CONTRACT (settled by a human decision, 2026-07-30): the transcript
      # fixture is ONE shared recorded graph under tests/fixtures/conveyor-transcript/
      # plus a transcript.yaml manifest — a top-level list of {command, node, block}.
      # An earlier draft of this step read a per-command-directory layout; the
      # test-verification lane's brief owns the fixture and specifies the manifest, so
      # the manifest wins and this step was corrected to match. The NEXT-block
      # sentinels are whatever tools/conveyor.ts actually renders — the resolver is the
      # authority. As shipped it opens with a line starting `NEXT ` and closes with a
      # line that is exactly `END`.
      - name: Transcription check (A9) — printed NEXT blocks vs spec:status
        run: |
          set -uo pipefail
          # The SCRIPT ITSELF must live inside the repository, for exactly the reason
          # leg 2's scratch copy does (see the comment further down): `--import tsx`
          # resolves bare specifiers through ./node_modules by walking up from the
          # script's own directory, so a script under /tmp dies on `import { load }
          # from "js-yaml"` with ERR_MODULE_NOT_FOUND before doing any work. It shipped
          # at /tmp/a9.ts and failed on the first real CI run while passing every local
          # re-enactment, because a local run extracts the script into the repo. The
          # trap is required, not tidiness: this step runs under `bash -e`, so a bare
          # `rm` after a failing `node` never executes and would leave the script — and
          # leg 2's scratch dir — behind in the working tree.
          A9="$GITHUB_WORKSPACE/.a9-step.ts"
          trap 'rm -rf "$A9" "$GITHUB_WORKSPACE"/.a9-replay-*' EXIT
          cat > "$A9" <<'A9_EOF'
          import { spawnSync } from "node:child_process";
          import * as fs from "node:fs";
          import * as path from "node:path";
          import { load } from "js-yaml";

          const FIXTURE = "tests/fixtures/conveyor-transcript";
          const summary = process.env["GITHUB_STEP_SUMMARY"];
          const say = (s: string): void => { if (summary) fs.appendFileSync(summary, s + "\n"); console.log(s); };
          const fail = (why: string): never => {
            console.log(`::error title=A9 transcription check::${why}`);
            say(`- FAIL: ${why}`);
            process.exit(1);
          };
          say("## A9 transcription check");

          const status = (cwd: string, nodeId?: string): { code: number; out: string } => {
            const args = ["--import", "tsx", path.resolve("tools/spec.ts"), "status"];
            if (nodeId !== undefined) args.push(nodeId);
            const r = spawnSync(process.execPath, args, { cwd, encoding: "utf8", shell: false });
            return { code: r.status ?? 1, out: (r.stdout ?? "") + (r.stderr ?? "") };
          };

          // Leg 3 first — needs no fixture, so the step has non-vacuous value even
          // before the fixtures land.
          const live = status(process.cwd());
          if (live.code !== 0) fail("spec:status failed against the live graph (leg 3)");
          if (!/^NEXT /m.test(live.out)) fail("live spec:status output carries no NEXT sentinel (leg 3)");
          if (!/^END$/m.test(live.out)) fail("live spec:status output carries no END sentinel (leg 3)");
          say("- OK: live-graph smoke (leg 3)");

          // Leg 1 — completeness / anti-vacuity. An absent or empty manifest is a
          // FAILURE, never a skip: that is the vacuous pass this leg exists to stop.
          if (!fs.existsSync(FIXTURE)) fail(`transcript fixture ${FIXTURE} is absent (leg 1)`);
          const manifestPath = path.join(FIXTURE, "transcript.yaml");
          if (!fs.existsSync(manifestPath)) fail(`${manifestPath} is absent (leg 1)`);
          const raw: unknown = load(fs.readFileSync(manifestPath, "utf8"));
          if (!Array.isArray(raw) || raw.length === 0) fail(`${manifestPath} is empty or not a list (leg 1)`);
          const entries = raw as { command?: string; node?: string; block?: string }[];
          for (const [i, e] of entries.entries()) {
            if (!e.command || !e.node || !e.block) fail(`manifest entry ${i} lacks command/node/block (leg 1)`);
          }
          const ls = spawnSync("git", ["ls-files", ".claude/commands"], { encoding: "utf8", shell: false });
          if (ls.status !== 0) fail("git ls-files .claude/commands failed (leg 1)");
          const chain = (ls.stdout ?? "").split("\n").filter(Boolean)
            .map((f) => path.basename(f, ".md"))
            .filter((c) => c !== "detect-drift" && c !== "update-spec-graph");
          if (chain.length === 0) fail("no chain command files found (leg 1)");
          const covered = new Set(entries.map((e) => e.command));
          const missing = chain.filter((c) => !covered.has(c));
          if (missing.length > 0) fail(`no transcript entry for chain command(s): ${missing.join(", ")} (leg 1)`);
          say(`- OK: completeness — ${chain.length} chain commands, ${entries.length} recorded blocks (leg 1)`);

          // Leg 2 — replay each recorded block against the recorded graph.
          // The scratch copy MUST live inside the repository: `--import tsx` resolves
          // through ./node_modules, so a dir under os.tmpdir() makes every spawn exit
          // 1 with ERR_MODULE_NOT_FOUND. tests/spec.test.ts documents the same trap.
          const tmp = fs.mkdtempSync(path.join(process.cwd(), ".a9-replay-"));
          fs.cpSync(path.join(FIXTURE, "specs"), path.join(tmp, "specs"), { recursive: true });
          let replayed = 0;
          for (const e of entries) {
            const r = status(tmp, e.node);
            if (r.code !== 0) fail(`${e.command}/${e.node}: spec:status exited ${r.code} (leg 2)`);
            if (!/^NEXT /m.test(r.out)) fail(`${e.command}/${e.node}: replayed output carries no NEXT sentinel (leg 2)`);
            if (r.out !== e.block) {
              say("```diff");
              say(`--- recorded (${e.command}/${e.node})`);
              for (const l of (e.block ?? "").split("\n")) say(`-${l}`);
              say("+++ actual");
              for (const l of r.out.split("\n")) say(`+${l}`);
              say("```");
              fail(`${e.command}/${e.node}: recorded NEXT block differs from spec:status output (leg 2)`);
            }
            replayed += 1;
          }
          fs.rmSync(tmp, { recursive: true, force: true });
          say(`- OK: fixture replay — ${replayed} blocks byte-identical (leg 2)`);
          A9_EOF
          node --import tsx "$A9"
