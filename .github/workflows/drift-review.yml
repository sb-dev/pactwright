name: drift-review

# Drift detection on every PR, in three layers with DIFFERENT enforcement:
#
#   1. The deterministic sensitive-paths gate (spec:check-diff) is BLOCKING — its
#      failure fails this job. It graduated from warn-only after behaving correctly
#      on ~5 real PRs (the criterion recorded in docs/drift-detection.md). Its
#      waiver path is an `override` node plus a `waives → check-diff` edge, the
#      check id registered in specs/schema/checks.yaml.
#   2. The Drift map step is INFORMATIONAL and keeps its own `continue-on-error:
#      true` deliberately — it is a reporter, not a gate. Do not "clean up" the
#      survivor for symmetry with layer 1.
#   3. The semantic /detect-drift judgment stays WARN-ONLY and, until a Claude Code
#      action is wired with pinned credentials, is run manually.
#
# HONEST BOUND: a failing job here BLOCKS NO MERGE until a repo admin marks
# `drift-review` a required status check (see docs/branch-protection.md). That
# setting is repo-admin state, not reproducible from files in this repo. Red is not
# blocked.
on:
  pull_request:

jobs:
  drift-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Deterministic layer — BLOCKING. A touched sensitive_paths glob needs a
      # linked approved contract (bound to the owning capability) or an override;
      # waivable by an `override` node plus a `waives → check-diff` edge.
      - name: Sensitive-paths gate (blocking)
        env:
          GATE_BASE: ${{ github.event.pull_request.base.sha }}
        run: pnpm spec:check-diff

      # Deterministic diff→capability packets, surfaced for the reviewer.
      - name: Drift map (informational)
        continue-on-error: true
        env:
          GATE_BASE: ${{ github.event.pull_request.base.sha }}
        run: pnpm spec:drift-map

      # Semantic layer — Claude-assisted /detect-drift, warn-only. Wire this to a
      # Claude Code action once credentials/model are pinned (amendment 10);
      # until then run `/detect-drift <pr-number>` manually and record findings
      # via graph-maintainer. See docs/drift-detection.md.
      - name: Semantic drift review (warn-only, manual until pinned)
        run: |
          echo "Run /detect-drift ${{ github.event.pull_request.number }} (warn-only)."
          echo "See docs/drift-detection.md for the blocking-flip criteria."
