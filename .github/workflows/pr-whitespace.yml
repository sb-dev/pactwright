name: Pull request whitespace

on: pull_request

permissions:
  contents: read

concurrency:
  group: pr-whitespace-${{ github.ref }}
  cancel-in-progress: true

jobs:
  whitespace:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Check changes against the base parent of the PR merge commit
        run: git diff --check HEAD^1 HEAD
