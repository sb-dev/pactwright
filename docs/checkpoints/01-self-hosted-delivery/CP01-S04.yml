# CP01 Step 4 — Implement current-lineage and authority derivation
id: CP01-S04
requires: [CP01-S02, CP01-S03]
outputs:
  lineage-derivation: Derivation of each Intent's current Delivery lineage, recorded authorised Contract and
    broad Delivery state from canonical records and typed edges alone.
requirements:
  R01:
    source: [CORE#15, CORE#44, CORE#45]
    statement: Derivation shall exclude superseded records and records reached only through a non-current
      ancestor, including the descendants of a superseded Intent; replacements shall not inherit old authority
      implicitly.
  R02:
    source: [CORE#9, CORE#15, CORE#31, CORE#44, CORE#45, CORE#58]
    statement: Recorded Contract authority shall come from one current proceeding Decision selecting one Contract;
      reject/defer select none, including when withdrawing a preceding proceed Decision. Derivation checks
      actor syntax, not authentication or lifecycle policy, and grants no execution permission.
  R03:
    source: [CORE#44]
    statement: Broad Delivery state shall be derived using the canonical open/deferred/rejected/contracted/delivering/done
      table, not stored as mutable graph fields.
  R04:
    source: [CORE#5, CORE#31, CORE#58]
    statement: A Gate or approval outside the applicable Decision shall not establish Contract authority.
  R05:
    source: [CORE#28, CORE#44]
    statement: Derivation shall be read-only and shall not duplicate canonical lineage/currency/state in persisted
      fields or create execution progress as graph truth.
  R06:
    source: [CORE#15, CORE#44, CORE#45, CORE#57, CORE#58]
    statement: Derivation shall fail explicitly for each affected Intent, returning its problems and no current
      lineage, recorded Contract or broad state, without selecting a winner. Every unaffected Intent shall
      return exactly its standalone lineage, recorded Contract and broad state. An incomplete load makes all
      results diagnostic-only; complete-state validation under CORE#55 still governs execution and mutation.
acceptance:
  AC01:
    covers: [R01, R02, R03]
    cases: [open, deferred, rejected, contracted, delivering, done]
    given: The minimal valid canonical graph for the listed state.
    when: Current lineage, recorded authorised Contract and broad Delivery state are derived.
    then: The state is the listed state; current lineage holds exactly the fixture current records. The authorised
      Contract is the one its current proceeding Decision selects for contracted, delivering and done, and
      is absent for open, deferred and rejected.
    verify:
      automated: [lineage.derived-states]
  AC02:
    covers: [R01, R02, R03]
    cases: [brief-change, contract-change, evidence-correction]
    given: 'A done lineage changed only by the listed CORE#45 pattern: brief-change adds a Brief superseding
      its current Brief under the same Contract; contract-change adds a Decision and Contract superseding
      the current ones and a Brief decomposing the new Contract; evidence-correction adds Evidence superseding
      the current Evidence under the same Brief. All predecessors remain stored.'
    when: Current lineage, authorised Contract and broad state are derived.
    then: The lineage contains exactly the replacement/current records and none superseded or reached only
      through a non-current ancestor. The authorised Contract is the new selected Contract after contract-change
      and remains the original for the other cases. State is delivering for brief-change and contract-change,
      and done for evidence-correction.
    verify:
      automated: [lineage.supersession]
  AC03:
    covers: [R02, R04]
    cases: [no-decision, defer, authority-frontmatter]
    given: An Intent with the listed Decision state, a separate valid contracted Intent, and non-canonical
      content recording a passed Gate and human approval of the other Intent Contract for the listed Intent.
      authority-frontmatter has no Decision; instead the listed Intent and the other Intent's Contract carry
      extra frontmatter fields approved_by and gate that record a human approval and a passed Gate.
    when: Contract authority is derived.
    then: The listed Intent remains open or deferred as applicable, with no authorised Contract; authority-frontmatter
      remains open. The other
      Contract is authorised only for its own Intent, whose lineage and state are unchanged.
    verify:
      automated: [authority.gate-not-decision]
  AC04:
    covers: [R01, R03, R05]
    given: A fixture repository and a copy whose only difference is contradictory non-canonical cached lineage
      or execution state.
    when: Derivation runs repeatedly.
    then: Both yield identical current lineages, authorised Contracts and broad states. Derivation creates,
      changes or deletes no file.
    verify:
      automated: [lineage.canonical-only]
  AC05:
    covers: [R05]
    given: Candidate record schemas, stored outputs and derivation call paths.
    when: Independent review checks state ownership and write boundaries.
    then: No field the runtime writes, or reads for derivation, and no other canonical state stores current
      lineage, record currency or broad Delivery state; no execution-progress node is stored as canonical truth.
    verify:
      review: [lineage.no-stored-derived-state]
  AC06:
    covers: [R01, R02, R06]
    cases: [two-current-decisions, decision-selects-two-contracts, proceed-without-contract, reject-selecting-contract,
      contract-superseded-without-decision, invalid-supersession-edge, malformed-decision, two-current-briefs,
      two-current-evidence, defer-selecting-contract, decision-resolves-two-intents, brief-decomposes-two-contracts,
      evidence-evidences-two-briefs, cross-intent-decision-supersession, cross-intent-contract-supersession,
      cross-contract-brief-supersession, cross-brief-evidence-supersession, reauthorisation-reselects-withdrawn-contract,
      replacement-intent-selects-old-contract, other-intent-selects-noncurrent-contract, reauthorisation-without-contract-supersession, contract-change-without-contract-supersession,
      replacement-intent-without-contract-supersession,
      historical-two-decisions, historical-two-briefs, historical-two-evidence]
    given: A lineage with only the listed fault, a separate valid Intent, and a standalone control for that
      valid Intent. Cross-intent supersession defects join unrelated directions, not an explicit Intent-replacement
      chain. Historical-cardinality cases place the competing heads under a non-current ancestor.
    when: Both are derived from the supplied graph and problems.
    then: The affected Intent returns its problems and no current lineage, Contract or broad state. The separate
      valid Intent lineage, authorised Contract and state equal its standalone control. Any incomplete load
      makes that result diagnostic and non-executable; no files change.
    verify:
      automated: [lineage.fails-closed]
  AC07:
    covers: [R01, R02, R03]
    cases: [proceed-to-reject, proceed-to-defer, defer-to-proceed, reject-to-proceed]
    given: A previously done lineage and the listed Decision transition with all predecessors retained. Withdrawal
      writes a reject/defer Decision superseding the proceed Decision and no new Contract or Contract supersession.
      Re-authorisation after withdrawal creates a new proceed Decision and a new Contract superseding the
      last Contract of that direction.
    when: The complete proposed graph is validated and its current lineage derived.
    then: Withdrawal yields rejected/deferred as applicable, with only its current Intent/Decision and no
      authorised Contract. Re-authorisation yields contracted with exactly its current Intent, new Decision
      and new Contract; old Brief/Evidence remain non-current and the last Contract is superseded.
    verify:
      automated: [lineage.withdrawal-and-reauthorisation]
  AC08:
    covers: [R02, R05]
    cases: [allowed-policy, denied-policy, changed-policy]
    given: Identical valid canonical Decisions with syntactically valid actor identities and the listed non-canonical
      policy condition.
    when: Only structural lineage derivation is called.
    then: All three cases yield exactly the same recorded lineage, Contract and broad state, with no execution
      permission, invocation or writes.
    verify:
      automated: [lineage.policy-separation]
  AC09:
    covers: [R01, R02, R03]
    cases: [empty-replacement, new-decision]
    given: A superseded Intent with done descendants and its replacement. The empty-replacement case has no
      Decision. The new-decision case has its own proceeding Decision and a fresh Contract superseding the
      old direction last Contract, but no Brief.
    when: Current lineage is derived.
    then: The old direction has no current lineage. The replacement is open without its own Decision, or contracted
      with its own new proceeding Decision/Contract; no old authority or completion is inherited.
    verify:
      automated: [lineage.intent-replacement]
  AC10:
    covers: [R02, R06]
    given: Two active Intent directions whose current Decisions select the same Contract, plus one independent
      valid direction and its standalone control.
    when: Lineage is derived.
    then: Both sharing directions return problems and no current lineage, Contract or state. The independent
      direction lineage, authorised Contract and state equal its standalone control. If the load is incomplete
      that control result is diagnostic-only. No execution permission or file changes result.
    verify:
      automated: [lineage.no-shared-current-contract]
