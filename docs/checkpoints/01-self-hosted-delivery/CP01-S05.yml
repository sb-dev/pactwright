# CP01 Step 5 — Implement repository and Project Graph revision identity
id: CP01-S05
requires: [CP01-S02, CP01-S03]
outputs:
  repository-revision: A runtime-provided repository revision identifying the exact repository state used as the reconstructible execution input base.
  project-graph-revision: A deterministic Project Graph revision derived from registered canonical Project Graph state only.
requirements:
  R01:
    source: [CORE#54, CORE#56, GUIDE#replay-provenance]
    statement: The runtime shall provide a repository revision that identifies the exact repository state used as the reconstructible execution input base.
  R02:
    source: [CORE#56]
    statement: The runtime shall derive the same Project Graph revision from the same canonical Project Graph state.
  R03:
    source: [CORE#56]
    statement: The Project Graph revision shall include registered canonical Delivery records and typed edges, including edges of registered additional relations.
  R04:
    source: [CORE#5, CORE#56]
    statement: The Project Graph revision shall exclude generated reports, adapter output, lifecycle execution state, execution provenance, GitHub state and other derived state.
  R05:
    source: [CORE#56]
    statement: The runtime shall canonicalise the ordering of canonical state before deriving the Project Graph revision.
  R06:
    source: [CORE#56, CORE#58]
    statement: The repository revision and the Project Graph revision shall be distinct identities.
acceptance:
  AC01:
    covers: [R01]
    given: A committed fixture repository state with a clean working tree.
    when: The runtime resolves its repository revision twice, including once in a separate process from a copy at another path.
    then: Both resolutions yield the same repository revision.
    verify: {automated: [revision.repository-stable]}
  AC02:
    covers: [R01]
    cases: [canonical-file-changed, non-canonical-file-changed]
    given: Two committed fixture repository states whose only difference is the listed file change.
    when: The runtime resolves the repository revision of each.
    then: The two repository revisions differ.
    verify: {automated: [revision.repository-identifies-state]}
  AC03:
    covers: [R02]
    given: A fixture canonical Project Graph state.
    when: The Project Graph revision is derived twice, including once in a separate process from a copy at another path.
    then: Both derivations yield the same Project Graph revision.
    verify: {automated: [revision.graph-stable]}
  AC04:
    covers: [R03]
    cases: [record-added, record-content-changed, edge-added, edge-removed, additional-relation-edge-added]
    given: Two valid fixture canonical states whose only difference is the listed canonical change.
    when: The Project Graph revision of each is derived.
    then: The two revisions differ.
    verify: {automated: [revision.graph-canonical-change]}
  AC05:
    covers: [R04]
    cases: [generated-report, adapter-output, lifecycle-execution-state, execution-provenance, github-state, derived-projection]
    given: Two fixture repository states with identical canonical state whose only difference is non-canonical fixture content standing in for the listed kind.
    when: The Project Graph revision of each is derived.
    then: The two revisions are identical.
    verify: {automated: [revision.graph-non-canonical-change]}
  AC06:
    covers: [R05]
    cases: [records-reordered, edges-reordered]
    given: The same canonical state stored in two copies whose only difference is the listed storage order.
    when: The Project Graph revision of each is derived.
    then: The two revisions are identical.
    verify: {automated: [revision.graph-order-independent]}
  AC07:
    covers: [R06]
    given: Two committed fixture repository states with identical canonical state whose only difference is one non-canonical file.
    when: Both revisions are resolved for each state.
    then: The repository revisions differ and the Project Graph revisions are identical.
    verify: {automated: [revision.distinct-identities]}
  AC08:
    covers: [R01]
    given: A repository revision recorded from a committed fixture state, after which a further commit changes a canonical record.
    when: The state the recorded revision identifies is restored at another path with existing repository mechanisms and its Project Graph revision is derived.
    then: The restored state is the recorded state, not the current one, and yields the Project Graph revision derived when the repository revision was recorded.
    verify: {automated: [revision.repository-reconstructible]}
