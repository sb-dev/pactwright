# CP01 Step 7 — Implement authoritative core mutations and Evidence closure guards
id: CP01-S07
requires: [CP01-S01, CP01-S02, CP01-S03, CP01-S04, CP01-S06]
outputs:
  mutation-api: The runtime canonical mutation API that every public entry point calls, performing plan, complete-state
    validation, immutability and authority guards, a serialised stored-base check, an atomic write and result
    validation.
  authoritative-mutations: Authorised mutations creating Intent, Decision with its selected Contract, Brief,
    Evidence, required edges and explicit supersession, including withdrawal and re-authorisation.
  evidence-closure-guards: Pre-mutation guards that refuse Evidence and its evidences edge until all five closure
    preconditions hold.
requirements:
  R01:
    source: [CORE#55, GUIDE#filesystem-mutation]
    statement: Every canonical mutation shall go through one runtime API that plans, validates the complete
      proposed state, writes atomically and validates the resulting state before reporting success. A failed
      mutation shall leave records, edges, configuration, lock and unrelated files unchanged.
  R02:
    source: [CORE#8, CORE#9, CORE#15, CORE#49]
    statement: A Decision shall resolve one Intent. A proceed Decision is written together with exactly one
      new Contract that it selects; reject and defer select none. Contract alternatives remain transient until
      one is selected and are never written as graph records.
  R03:
    source: [CORE#31, CORE#58]
    statement: Approval or Gate state shall never create a Decision; only the Decision mutation establishes
      Contract authority.
  R04:
    source: [CORE#11, CORE#14, CORE#15, CORE#45]
    statement: Mutations shall add Intents, Briefs decomposing the current Contract, Evidence evidencing the
      current Brief, required lineage edges and explicit same-type supersession, preserving every predecessor.
  R05:
    source: [CORE#45, CORE#55]
    statement: Before writing, the API shall apply the Step 2 record and Step 3 core-edge immutability checks
      against the completely loaded stored graph the plan validated. Rewriting any stored core record in place,
      including an unresolved Intent, deleting it, removing it and adding another ID, and replacing or removing
      a core edge tuple shall be refused.
  R06:
    source: [CORE#54, CORE#55]
    statement: The API shall recheck the exact stored base (the bytes and inventory of configuration, lifecycle,
      lock and active canonical-storage inputs, with registry and decoder identities) and write within one boundary
      serialised against other Pactwright mutations. A changed base or incomplete load is refused without
      overwriting a concurrent change.
  R07:
    source: [CORE#9, CORE#27, CORE#57]
    statement: The supplied actor is attribution, not identity-provider authentication. Before committing a
      Decision the guard shall require valid actor syntax and a kind the actual lifecycle policy allows, and
      record the full decided_by value unchanged. Denial rests only on a disallowed kind or invalid syntax, never
      on a Git identity or identity allow-list.
  R08:
    source: [CORE#44, CORE#45]
    statement: A reject or defer Decision may supersede a current proceed Decision without writing a Contract
      or Contract supersession. Re-authorisation writes a new proceed Decision and a fresh Contract superseding
      the last Contract of the direction, even when the previous Decision selected none. Re-selecting a stored
      Contract or omitting required supersession shall be refused. Each case is validated as one complete proposed
      graph and written atomically.
  R09:
    source: [CORE#14, CORE#25, CORE#53, CORE#58]
    statement: Before creating Evidence or its evidences edge, a runtime guard shall require that the Brief is
      current, the latest delivered state has been reviewed, the closing Review permits successful closure,
      no required Gate is unresolved and the Contract and Brief lineage is valid. A check after writing Evidence
      does not satisfy this.
  R10:
    source: [CORE#25, CORE#30, CORE#58]
    statement: A delivery change after Review shall require Review of the new delivered state before Evidence
      closure.
acceptance:
  AC01:
    covers: [R01, R02, R04]
    cases: [intent, intent-replacement, proceed-decision, reject-decision, defer-decision, brief, brief-supersession,
      contract-change, evidence, evidence-correction]
    given: A complete valid graph, an allowed actor where a Decision is involved, and a request for the listed
      change.
    when: The mutation is applied through the runtime API.
    then: Exactly the expected new records and edges are written, the proposed and resulting states validate,
      every predecessor is preserved and derived lineage reflects the change.
    verify:
      automated: [mutation.valid-changes]
  AC02:
    covers: [R02]
    given: An open Intent with three proposed Contract alternatives and a proceed request selecting one of them.
    when: The alternatives are proposed and the proceed Decision is then applied.
    then: No record or edge exists for any alternative before selection. Afterwards only the selected Contract
      exists, with its Decision and resolves/selects edges; the other alternatives leave no canonical record.
    verify:
      automated: [mutation.alternatives-transient]
  AC03:
    covers: [R03]
    cases: [gate-resolved, approval-recorded]
    given: A delivering lineage and the listed Gate resolution or human approval recorded outside a Decision.
    when: The change is applied.
    then: No Decision, Contract or other canonical record or edge is created, and the recorded Contract is unchanged.
    verify:
      automated: [mutation.no-implicit-decision]
  AC04:
    covers: [R07]
    cases: [allowed-kind, second-identity-same-kind, disallowed-kind-proceed, disallowed-kind-reject, disallowed-kind-defer,
      invalid-syntax]
    given: An open Intent, the project's real .pactwright/lifecycle.yml allowing one actor kind for approve-contract,
      and a Decision request supplied with the listed actor and outcome (proceed unless named);
      second-identity-same-kind uses a different well-formed identity of the allowed kind. In every case the
      repository's configured Git user identity matches neither supplied identity.
    when: The Decision mutation is applied.
    then: The allowed-kind and second-identity requests commit and record the supplied decided_by value byte
      for byte, never the Git identity. The disallowed-kind and invalid-syntax requests are refused; no Decision,
      Contract or edge is written, and unrelated files and execution state keep their prior bytes.
    verify:
      automated: [mutation.actor-policy]
  AC05:
    covers: [R05]
    cases: [unresolved-intent-rewrite, record-rewrite, record-deletion, rename-plus-add, core-edge-replacement,
      core-edge-removal]
    given: A complete valid stored graph and a proposed graph whose only defect is the listed change to stored
      core state.
    when: The mutation is applied.
    then: It is refused before writing with a problem identifying the record or tuple; stored records, edges,
      unrelated files and execution state are byte-identical afterwards.
    verify:
      automated: [mutation.immutability]
  AC06:
    covers: [R01, R06]
    cases: [changed-graph, changed-configuration, changed-lifecycle, changed-lock, added-input, changed-registry-identity,
      changed-decoder-identity, incomplete-load-at-plan, incomplete-load-before-commit]
    given: A mutation planned against a stored base, with the listed condition. incomplete-load-at-plan fails
      loading when the plan is made; the other cases change the base after a complete plan and before commit,
      through another writer's edit, a changed registry identity, changed decoder code or a load failure. changed-decoder-identity
      replaces decoder code bytes that the CP01-S01/R10 identity covers, with no declaration or version change.
      An unchanged-base control.
    when: The mutation is planned and committed.
    then: Each listed case is refused as stale or incomplete, nothing is written and any other writer's change
      is preserved byte for byte. The control commits.
    verify:
      automated: [mutation.stale-base]
  AC07:
    covers: [R06]
    given: Two Pactwright mutations planned against the same stored base and started concurrently in separate
      runtime processes.
    when: Both attempt to commit.
    then: The boundary serialises them. Exactly one commits and the other is refused as stale rather than overwriting
      it; the resulting graph validates and contains only the committed change.
    verify:
      automated: [mutation.serialised-race]
  AC08:
    covers: [R01]
    cases: [proposed-state-invalid, write-failure, result-validation-failure]
    given: A valid mutation request that writes several files and the listed forced failure; write-failure
      is injected after the first of those files has been written.
    when: The mutation is applied.
    then: The mutation reports failure; no record or edge is partially written, and records, edges, configuration,
      lock, unrelated files and execution state keep their prior bytes.
    verify:
      automated: [mutation.atomic-failure]
  AC09:
    covers: [R08]
    cases: [reject-withdrawal, defer-withdrawal]
    given: A done lineage and a request for the listed Decision superseding its current proceed Decision.
    when: The withdrawal is applied.
    then: One new Decision is written with only its resolves and supersedes edges, and no Contract or Contract
      supersession. The withdrawn Decision, Contract, Brief and Evidence remain stored; derivation yields rejected
      or deferred with no authorised Contract. Refusing the withdrawal, as released 0.0.1 does, fails this criterion.
    verify:
      automated: [mutation.withdrawal]
  AC10:
    covers: [R08]
    cases: [after-reject, after-defer]
    given: A lineage whose proceed Decision was withdrawn by the listed Decision.
    when: A new proceed Decision with a fresh Contract is applied.
    then: The complete proposed graph validates and is written atomically. The new Decision supersedes the withdrawing
      Decision and the new Contract supersedes the last Contract of the direction, although the immediately
      previous Decision selected none; derivation yields contracted with the new Contract.
    verify:
      automated: [mutation.reauthorisation]
  AC11:
    covers: [R08]
    cases: [reselect-withdrawn-contract, reselect-current-contract, other-intent-selects-existing-contract, missing-contract-supersession,
      missing-decision-supersession]
    given: A lineage and a Decision request whose only defect is the listed case; other-intent-selects-existing-contract
      is a Decision of an unrelated Intent selecting a stored Contract.
    when: The mutation is applied.
    then: It is refused as invalid lineage before writing; records, edges, unrelated files and execution state
      keep their prior bytes.
    verify:
      automated: [mutation.reauthorisation-refusals]
  AC12:
    covers: [R09, R10]
    cases: [superseded-brief, never-reviewed, unreviewed-delivery-change, blocking-closing-review, pending-gate,
      invalid-lineage]
    given: A delivering lineage whose only closure defect is the listed precondition failure; never-reviewed
      has delivered state but no Review at all.
    when: Evidence creation is requested through the runtime API.
    then: The guard refuses before any write and names the failed precondition. No Evidence record or evidences
      edge exists afterwards, even partially, and unrelated files and execution state keep their prior bytes.
    verify:
      automated: [evidence.closure-guards]
  AC13:
    covers: [R09, R10]
    given: A delivering lineage changed after its first Review and then reviewed again, whose closing Review
      of that latest state permits closure, with no pending Gate and valid lineage.
    when: Evidence creation is requested.
    then: Exactly one Evidence record and its evidences edge are written atomically, the resulting graph validates
      and the lineage derives done.
    verify:
      automated: [evidence.successful-closure]
  AC14:
    covers: [R01, R09]
    given: Candidate runtime code and every public mutation path it exposes.
    when: Independent review traces each path from entry point to write.
    then: Every canonical write, including Evidence, passes through the one mutation API with its guards applied
      before writing. There is no alternative writer, post-write-only guard or prompt-only enforcement.
    verify:
      review: [mutation.single-entry-point]
