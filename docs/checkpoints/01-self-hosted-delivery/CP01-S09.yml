# CP01 Step 9 — Implement the complete core validation contract and bounded context assembly
id: CP01-S09
requires: [CP01-S01, CP01-S02, CP01-S03, CP01-S04, CP01-S05, CP01-S06, CP01-S07]
outputs:
  validate-command: A read-only pactwright validate implementing the complete Core §57 minimum detection contract
    without repairing state.
  context-assembly: A runtime context-assembly API giving Agent Packs and adapters bounded current Contract/Brief
    lineage context, with a namespaced contribution seam for later Extensions.
requirements:
  R01:
    source: [CORE#57]
    statement: Validate shall detect each of the seventeen CORE#57 minimum rules as a problem that identifies
      the rule and the affected records, inputs or provenance.
  R02:
    source: [CORE#55, CORE#57]
    statement: Validate shall be read-only and never repair graph state. It reuses the Step 1 problem collection
      and the Steps 2–4 structural validators, and pre-mutation validation uses the same mechanics wherever
      possible rather than a second validator.
  R03:
    source: [CORE#15, CORE#44, CORE#45, CORE#57]
    statement: Rule 5 shall include several current Decisions or Contracts for one direction; rules 6 and 7
      competing current Briefs or Evidence and cross-parent replacements; rule 8 branching and merging supersession.
  R04:
    source: [CORE#9, CORE#27, CORE#57]
    statement: Rule 13 shall check each current Decision's recorded actor kind against the actual lifecycle
      policy, separately from lineage derivation, preserving the supplied identity as attribution. A policy
      change alone shall not invalidate withdrawn historical Decisions. A requested historical policy check
      restores lifecycle configuration from the recorded repository revision in execution provenance and reports
      unavailable, not unauthorised, when that evidence is absent or unreconstructible.
  R05:
    source: [CORE#23, CORE#25, CORE#28, CORE#34, CORE#57]
    statement: 'Rules 9–12, 14 and 15 shall check lifecycle configuration and execution state: a missing shape,
      unresolved or incompatible shape identity, impossible transitions, Evidence before successful closing
      Review, Gate progression without its configured authority and unbounded corrective loops.'
  R06:
    source: [CORE#56, CORE#57, GUIDE#replay-provenance]
    statement: Rule 17 shall run only when replay validation is requested. It resolves the entire replay base
      before any execution effect, verifies the typed Git repository identity and pg1 revision, and reports
      unknown or legacy protocols, unavailable or dirty input bases and reconstructed-state mismatch. Unavailable
      identity is refused without creating an attempt or replay record.
  R07:
    source: [CORE#54, CORE#56, CORE#57]
    statement: A partial load shall never produce a whole-graph pass, and diagnostics distinguish malformed
      structure, unsupported or inactive components and unavailable execution authority. Ordinary diagnostics
      and graph-only hashing need no Git; hashing uses the loaded root and reflects uncommitted canonical edits.
  R08:
    source: [CORE#4, CORE#57, DISTRIBUTION#10]
    statement: Rule 16 shall detect Extension state that illegally redefines core Delivery semantics, proven
      at this step through a fixture graph contribution.
  R09:
    source: [CORE#3, CORE#8, CORE#13, CORE#39]
    statement: The context-assembly API consumed by Agent Packs and adapters shall provide the current relevant
      Contract/Brief lineage by default and exclude rejected alternatives, superseded state, execution transcripts
      and unrelated history unless a caller explicitly requires them. Contributing context does not transfer
      semantic ownership.
  R10:
    source: [CORE#39, PRINCIPLES#11]
    statement: Context assembly shall keep a namespaced context-contribution seam for later Extensions and shall
      not introduce pactwright context as a required public CLI contract.
acceptance:
  AC01:
    covers: [R01, R05, R08]
    cases: [malformed-core-node, invalid-core-relationship, missing-required-lineage, contradictory-current-records,
      multiple-current-decisions-or-contracts, invalid-brief-contract-lineage, invalid-evidence-brief-lineage,
      illegal-supersession, missing-lifecycle-shape, unresolved-shape-identity, impossible-shape-transition,
      evidence-before-closing-review, unauthorised-decision, unauthorised-gate-progression, unbounded-corrective-loop,
      extension-redefines-core, replay-revision-mismatch]
    given: A valid control project and a copy whose only defect is the failing fixture for the listed rule;
      the replay case requests replay validation.
    when: Pactwright validate runs on both.
    then: The control passes with no problems. The copy fails with a problem mapped to the listed rule that identifies
      the affected records, inputs or provenance.
    verify:
      automated: [validate.minimum-rules]
  AC02:
    covers: [R02]
    given: Each AC01 failing fixture, plus a graph missing a required supersession edge that a repair could add.
    when: Pactwright validate runs.
    then: Every file under the project root, including execution state, is byte-identical afterwards; no repair,
      default or rewrite occurs.
    verify:
      automated: [validate.read-only]
  AC03:
    covers: [R03]
    cases: [two-current-decisions, two-current-contracts, competing-current-briefs, competing-current-evidence,
      cross-parent-brief-replacement, cross-parent-evidence-replacement, branching-supersession, merging-supersession]
    given: A graph whose only defect is the listed lineage fault.
    when: Pactwright validate runs.
    then: It fails with the rule 5, 6, 7 or 8 problem that owns the fault, identifying the competing or cross-parent
      records.
    verify:
      automated: [validate.lineage-detail]
  AC04:
    covers: [R04]
    cases: [allowed-current-kind, disallowed-current-kind, policy-changed-for-withdrawn-decision, historical-check-reconstructible,
      historical-check-unavailable]
    given: A lineage with the listed actor and policy condition. The historical cases request a historical policy
      check for a withdrawn Decision, with or without execution provenance whose recorded repository revision
      restores that Decision's lifecycle configuration.
    when: Pactwright validate runs.
    then: The allowed kind passes. The disallowed current kind fails rule 13 and the decided_by value is unchanged.
      A policy change alone raises no problem for the withdrawn Decision. The reconstructible check evaluates
      against the restored configuration; the unavailable check reports unavailable verification, not an unauthorised
      Decision. Lineage derivation output is identical across cases.
    verify:
      automated: [validate.actor-policy]
  AC05:
    covers: [R06]
    cases: [not-requested, matching-sha1-base, matching-sha256-base, pg1-stored-byte-vectors, unknown-protocol,
      legacy-protocol, unavailable-base, dirty-base, reconstructed-state-mismatch]
    given: Execution provenance recording a repository revision and Project Graph revision under the listed
      condition; not-requested is ordinary validation of a project whose recorded history cannot be reconstructed.
    when: Pactwright validate runs, with replay validation requested except for not-requested.
    then: Not-requested attempts no historical reconstruction and raises no replay problem. Matching bases pass
      and the pg1 vectors reproduce their fixed bytes and digests. Unknown and legacy protocols report unavailable
      replay verification without reinterpreting the digest. Unavailable and dirty bases are refused before
      any execution effect, with no attempt or replay record. Mismatch fails rule 17 naming both revisions.
    verify:
      automated: [validate.replay]
  AC06:
    covers: [R07]
    cases: [incomplete-load, inactive-extension, no-git, uncommitted-canonical-edit]
    given: A project with the listed condition and otherwise valid canonical state.
    when: Pactwright validate runs and the graph revision is computed.
    then: An incomplete load fails with its input problem and never reports a whole-graph pass. An inactive
      Extension is reported as inactive, not malformed. Without Git, ordinary validation and graph-only hashing
      succeed. An uncommitted canonical edit changes the revision computed from the loaded root.
    verify:
      automated: [validate.partial-and-no-git]
  AC07:
    covers: [R08]
    cases: [core-record-type, core-relation-constraint, core-lineage-tuple]
    given: A fixture graph contribution whose only defect is the listed attempt to redefine core Delivery semantics,
      and a valid fixture contribution as control.
    when: Pactwright validate runs.
    then: The defect fails rule 16 and the core semantics stay effective; the control passes. This fixture proof
      does not establish installed Extension loading.
    verify:
      automated: [validate.extension-core-protection]
  AC08:
    covers: [R09]
    cases: [rejected-alternatives, superseded-records, execution-transcripts, unrelated-history, explicitly-required-history]
    given: A delivering lineage whose project also holds the listed material, and a Delivery context request
      for its current Brief; explicitly-required-history names a superseded Brief the caller requires.
    when: Delivery context is assembled.
    then: The context contains the current Contract/Brief lineage and excludes the listed material, except that
      explicitly required history is included and marked non-current. Assembly writes nothing.
    verify:
      automated: [context.bounded-lineage]
  AC09:
    covers: [R09, R10]
    given: Two fixture context contributions under different namespaces, one of which supplies text that restates
      the governing Contract differently.
    when: Delivery context is assembled.
    then: Each contribution appears under its own namespace, and neither replaces nor edits the governing Contract/Brief
      content.
    verify:
      automated: [context.namespaced-contributions]
  AC10:
    covers: [R02, R10]
    given: Candidate validation, mutation and CLI code.
    when: Independent review traces the validation rules and the public command surface.
    then: Validate and the mutation guards call the same Step 1–4 validators, with no parallel validator or
      repair path, and no pactwright context command is required.
    verify:
      review: [validate.shared-mechanics]
