# CP01 Step 11 — Implement Agent Pack selection and upgrade
id: CP01-S11
requires: [CP01-S01, CP01-S10]
outputs:
  agent-pack-use: A pactwright agent-pack use <source> that explicitly selects one compatible complete Agent Pack
    from a package name, optionally versioned, or a pack path, obtains a package it needs through the project
    package manager, and updates configuration and lock only after successful resolution and validation.
  agent-pack-upgrade: A pactwright agent-pack upgrade that upgrades the selected pack within its configured compatibility
    constraints through the project package manager without changing its identity.
  package-manager-delegation: The runtime's single package-manager delegation seam, detecting the project package
    manager under the DISTRIBUTION#15 rule and issuing its install, request-at-constraint, exact-restore, removal
    and isolated-acquisition requests, reused by later steps that need packages.

requirements:
  R01:
    source: [DISTRIBUTION#5]
    statement: 'Agent-pack use shall accept the source grammar: a package name, optionally followed by @ and an
      exact version or ^x.y.z caret range recorded as the configured constraint, with the caret range of the
      resolved exact version recorded when none is given; or a ./, ../ or absolute path to a pack directory,
      recorded as the source with no constraint. In order it shall: resolve the pack from the project''s installed
      packages, then the runtime''s own dependencies, or from the path; validate it against the required capabilities
      through the Step 10 check; update configuration; record the exact pack and agent identities in the lock;
      run sync; and report GitHub reconciliation needs. Configuration and lock change only after resolution
      and validation succeed.'
  R02:
    source: [DISTRIBUTION#5, DISTRIBUTION#15]
    statement: If resolution, compatibility, capability validation, locking or sync fails, use and upgrade shall leave the previous configuration, lock, generated environment and canonical state byte-identical, and
      shall leave the package-manager manifest and lock at the previous installed version and constraint, restoring
      them or removing a dependency the command added; when restoration itself fails, the report names the
      previous exact version to restore.
  R03:
    source: [DISTRIBUTION#3, DISTRIBUTION#5]
    statement: Pactwright shall never silently select or switch a pack. Pack identity changes only through agent-pack
      use with an explicit source. Missing selection is an unactivated scaffold, not implicit selection of
      @pactwright/standard. Pactwright may recommend a compatible pack without selecting it.
  R04:
    source: [DISTRIBUTION#5, DISTRIBUTION#15]
    statement: Agent-pack upgrade shall request the configured source at its configured constraint from the
      project package manager, so that the package manager resolves the version satisfying it, replacing the installed
      package when that version differs from the locked one, and reconciles the package manifest to that constraint,
      then resolve and validate the installed candidate through the Step 10 check before changing the lock or
      generated environment. It never changes the source identity. When the package manager's resolution of
      the constraint is the version already locked, which an exact constraint equal to the locked version or
      a range with no newer satisfying version produces, it reports that nothing changed.
  R05:
    source: [DISTRIBUTION#3, DISTRIBUTION#12]
    statement: Configuration expresses desired constraints and the lock the exact resolved pack. An exact configured
      version shall stay selected when a newer compatible version is available, and no constraint authorises
      replacing the configured source with another pack.
  R06:
    source: [CORE#54, DISTRIBUTION#3]
    statement: Use and upgrade shall read and write the released version 1 configuration through the Step 1
      canonical loader, preserving the adapter, Extension and GitHub declarations. Missing, malformed or unsupported
      configuration shall be refused without selecting a pack, parsing it another way or replacing the previous
      valid environment.
  R07:
    source: [CORE#54, DISTRIBUTION#5, DISTRIBUTION#14]
    statement: The GitHub report shall state what remote reconciliation, owned by pactwright github sync, the
      change needs, or that none is needed. Neither command contacts or mutates GitHub.
  R08:
    source: [DISTRIBUTION#15, DISTRIBUTION#25, GUIDE#command-ownership]
    statement: 'Package installation or replacement that use or upgrade needs shall be delegated to the project
      package manager through the runtime''s single package-manager delegation seam, which detects the package
      manager under the DISTRIBUTION#15 rule: the repository''s packageManager declaration, otherwise unambiguous
      lock state, refusing ambiguous or absent state before any change and never switching package managers.
      The seam''s requests are: install a package as a development dependency, request a source at a constraint,
      restore an exact installed version under the previous constraint, remove a dependency the command added or, for extension remove, the Extension''s package,
      acquire an exact version into an isolated location outside the project, and list the versions of a package the registry offers. Use requests installation only when no installed package satisfies
      the request; path sources involve no package manager. Pactwright implements no parallel installer and never copies, fetches or unpacks a
      package. Neither command changes the runtime or an Extension.'
  R09:
    source: [DISTRIBUTION#12, DISTRIBUTION#14]
    statement: 'The lock written by use and upgrade shall be the DISTRIBUTION#12 version 1 document: version
      1, runtime.version, agent_pack with the configured source, exact version and content hash, agents and
      skills maps with the content hash of each direct prompt and skill, and existing extensions entries preserved,
      written through the one resolution path that Step 15 completes with lock agreement and environment_lock_hash,
      neither of which Step 11 derives. Sync is the runtime''s single sync entry point, which at Step 11 loads
      configuration and lock, validates the composition and assembles agents and skills; its rendering is a
      seam that writes no file until Step 12 supplies the adapter, and Step 17 proves determinism and convergence.'
acceptance:
  AC01:
    covers: [R01, R03, R09]
    cases: [select-standard-from-scaffold, switch-to-compatible-fixture, versioned-source, path-source]
    given: 'An initial scaffold with no selected pack for select-standard-from-scaffold, or a project with @pactwright/standard
      selected otherwise, and the listed pack installed: @pactwright/standard, a complete compatible fixture
      pack, that fixture requested as <name>@^1.0.0, or that fixture by relative path.'
    when: Agent-pack use runs with that pack's explicit source.
    then: Configuration names the explicit source with the given constraint, the caret range of the resolved
      exact version when none was given, or no constraint for the path. The lock is the version 1 document
      recording the runtime version, the configured source, the exact pack version and content hash, each agent
      and skill hash and the existing extensions entries, and no environment_lock_hash. Sync ran through the
      single entry point, and the report states the GitHub reconciliation need.
    verify:
      automated: [agent-pack.use]
  AC02:
    covers: [R01, R02]
    cases: [incompatible-runtime, missing-capability, unresolvable-source, malformed-pack, sync-failure]
    given: A project with @pactwright/standard selected and a valid generated environment, and a candidate
      source with the listed defect; sync-failure injects a failure into sync after validation passes.
    when: Agent-pack use runs with the candidate source.
    then: It is refused with a problem naming the defect. Configuration, lock, generated environment and canonical
      files are byte-identical afterwards, the package-manager manifest and lock are byte-identical or restored,
      and @pactwright/standard remains selected.
    verify:
      automated: [agent-pack.use-failure]
  AC03:
    covers: [R03]
    given: An initial scaffold with no selected pack and @pactwright/standard installed.
    when: Agent-pack upgrade runs and a compatible pack is recommended.
    then: Upgrade is refused because no pack is selected. The recommendation names a pack without selecting
      it; configuration and lock are unchanged.
    verify:
      automated: [agent-pack.no-silent-selection]
  AC04:
    covers: [R04, R08, R09]
    cases: [range-newer-available, exact-constraint-differs]
    given: A fixture pack selected and locked at 1.0.0 under a configured ^1.0.0 constraint for range-newer-available,
      or a configured exact 1.1.0 constraint with 1.0.0 still locked and installed for exact-constraint-differs,
      and the delegation seam instrumented so that the request for the configured source at that constraint
      installs a compatible complete 1.1.0 of the same source.
    when: Agent-pack upgrade runs.
    then: The seam received exactly one request naming the configured source and constraint. The lock records
      1.1.0 with the same source, its content hash and agent identities, and sync ran. The configured source
      and constraint, and the runtime and Extension identities in configuration and lock, are unchanged.
    verify:
      automated: [agent-pack.upgrade]
  AC05:
    covers: [R02, R04]
    cases: [missing-capability, incompatible-runtime, sync-failure]
    given: 'A fixture pack selected at 1.0.0 under a configured ^1.0.0 constraint and the delegation seam instrumented
      so that the request installs a 1.1.0 with the listed defect; sync-failure installs a valid 1.1.0 and
      sync fails.'
    when: Agent-pack upgrade runs.
    then: Nothing is upgraded, and the problem names the missing capability, incompatibility or sync failure.
      Configuration, lock and generated environment are byte-identical, 1.0.0 of the same source remains selected,
      and the package-manager manifest and lock are at the previous installed version and constraint through
      a restore request for exactly 1.0.0.
    verify:
      automated: [agent-pack.upgrade-failure]
  AC06:
    covers: [R05]
    given: Configuration selecting a fixture pack at exactly 1.0.0, with a compatible 1.1.0 of the same source
      and a different complete pack both available to the delegation seam.
    when: Agent-pack use is re-applied with the configured source and agent-pack upgrade runs.
    then: Any request names exactly 1.0.0, the lock still records 1.0.0 of the configured source, upgrade reports
      that nothing changed within the exact constraint, and the other pack is never selected.
    verify:
      automated: [agent-pack.exact-target]
  AC07:
    covers: [R06]
    cases: [round-trip, missing-config, malformed-config, unsupported-version]
    given: A previous valid environment, and configuration in the listed condition; round-trip configuration
      also declares an adapter, a disabled Extension and GitHub.
    when: Agent-pack use runs with an explicit compatible source.
    then: In round-trip only the agent_pack entry changes, and the loader reads back the new selection with
      the other declarations unchanged. The other cases are refused with the loader's problem; no pack is selected
      and the previous environment is byte-identical.
    verify:
      automated: [agent-pack.config-loading]
  AC08:
    covers: [R07]
    cases: [github-absent, github-declared]
    given: A project whose configuration omits GitHub or declares it enabled, as listed, and a compatible pack
      source.
    when: Agent-pack use runs with network access to GitHub blocked and recorded.
    then: The report states that no reconciliation is needed, or which reconciliation pactwright github sync
      would need. No GitHub request is attempted.
    verify:
      automated: [agent-pack.github-report]
  AC09:
    covers: [R06, R08]
    given: The candidate agent-pack use and upgrade code.
    when: Independent review traces package, configuration and lock handling.
    then: Package installation or replacement is delegated only through the package-manager delegation seam,
      and the runtime copies, fetches and unpacks nothing. Configuration is read and written only through the
      canonical loader, and neither command changes runtime or Extension identity.
    verify:
      review: [agent-pack.ownership]
  AC10:
    covers: [R01, R08]
    cases: [installed-no-request, unversioned-source-delegated, constrained-source-delegated, installed-then-refused,
      install-failure, ambiguous-package-manager, path-source-no-request]
    given: A project with an explicit packageManager declaration and the delegation seam instrumented; ambiguous-package-manager
      has no declaration and two package-manager lockfiles. installed-no-request has the requested pack installed
      at a satisfying version; unversioned-source-delegated, constrained-source-delegated, installed-then-refused
      and install-failure do not, installed-then-refused installs a pack that then fails the capability check, and constrained-source-delegated requests <name>@^1.0.0; path-source-no-request uses a complete
      fixture pack by path.
    when: Agent-pack use runs with the listed source.
    then: installed-no-request and path-source-no-request select the pack with no request to the seam. unversioned-source-delegated
      issues exactly one request naming the bare package name as a development dependency, then resolves the
      installed pack and records the caret range of its exact version as the constraint. constrained-source-delegated
      issues exactly one request naming <name>@^1.0.0 and records ^1.0.0. installed-then-refused is refused naming
      the missing capability after exactly one install request and one removal request, leaving the package-manager
      manifest and lock byte-identical. install-failure is refused naming the package-manager failure. ambiguous-package-manager is refused before any request, naming the ambiguity.
      In the refused cases configuration, lock, generated environment and canonical state are byte-identical.
    verify:
      automated: [agent-pack.package-delegation]
  AC11:
    covers: [R04]
    given: A fixture pack selected at 1.0.0 under a configured ^1.0.0 constraint and the delegation seam instrumented
      so that only an otherwise valid 2.0.0 is newer, so the request for the configured constraint changes nothing.
    when: Agent-pack upgrade runs.
    then: Upgrade succeeds with no problem and reports that nothing changed. Configuration, lock, generated environment
      and the package-manager manifest and lock are byte-identical, and 1.0.0 of the same source remains selected.
    verify:
      automated: [agent-pack.upgrade-no-change]
  AC12:
    covers: [R02, R04]
    given: A fixture pack selected at 1.0.0 under a configured ^1.0.0 constraint and the delegation seam instrumented
      so that the request installs an incomplete 1.1.0 and the restore request for exactly 1.0.0 then fails.
    when: Agent-pack upgrade runs.
    then: Nothing is upgraded, and the problem names the missing capability and the failed restore. Configuration,
      lock and generated environment are byte-identical and 1.0.0 of the same source remains selected. The
      package-manager manifest and lock are reported in their residual state, with 1.1.0 installed, and the
      report names 1.0.0 as the exact version to restore and the restore request that failed.
    verify:
      automated: [agent-pack.upgrade-restore-failure]
