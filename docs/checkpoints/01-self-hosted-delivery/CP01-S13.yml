# CP01 Step 13 — Implement Pactwright evaluation and baseline comparison
id: CP01-S13
requires: [CP01-S07, CP01-S08, CP01-S10, CP01-S11]
outputs:
  eval-command: A pactwright eval that runs core responsibility evaluation against the resolved AI execution
    environment, keeping deterministic assertions separate from semantic judgement.
  core-eval-cases: Core-owned evaluation cases for Contract fidelity, scope discipline, Brief quality, Review
    quality and defect detection, Evidence accuracy and lifecycle compliance, plus required output structure
    and forbidden mutation.
  baseline-comparison: A pactwright eval --baseline --candidate comparison that resolves both sides exactly
    and reports regressions by capability, agent, case and changed environment component.
requirements:
  R01:
    source: [DISTRIBUTION#21, DISTRIBUTION#23]
    statement: Pactwright eval shall run core responsibility cases for Contract fidelity, scope discipline, Brief
      quality, Review quality and defect detection, Evidence accuracy and lifecycle compliance, plus required
      output structure and forbidden mutation, against the resolved environment and independently of a real
      Delivery.
  R02:
    source: [DISTRIBUTION#23, DISTRIBUTION#26]
    statement: Core cases shall be owned and versioned by the core runtime. Evaluation results are generated artefacts,
      not Project Graph records; eval writes no canonical state, configuration or lock.
  R03:
    source: [DISTRIBUTION#23]
    statement: Evidence accuracy cases shall compare the claimed delivered work and verification with the actual
      recorded results.
  R04:
    source: [CORE#58, DISTRIBUTION#23]
    statement: Lifecycle compliance cases shall cover authority, Gate stopping, valid transitions and successful
      closing Review before Evidence.
  R05:
    source: [DISTRIBUTION#23, PRINCIPLES#17]
    statement: Deterministic assertions and semantic judgement shall be evaluated and reported separately; deterministic
      validation is used wherever it can decide the result.
  R06:
    source: [DISTRIBUTION#12, DISTRIBUTION#24]
    statement: Eval --baseline <released-pack-or-baseline> --candidate <candidate-pack-or-environment> shall
      resolve each side to exact identities, including pack version and content hash and agent, prompt and
      direct-skill identities. An input that cannot be resolved exactly fails explicitly without substituting
      another version.
  R07:
    source: [DISTRIBUTION#24, PRINCIPLES#17]
    statement: The comparison shall report regressions by capability, agent, evaluation case and changed pack,
      prompt or direct-skill component. No single opaque aggregate score decides the result.
acceptance:
  AC01:
    covers: [R01, R02]
    given: A project with a complete fixture pack whose agents return scripted outputs, selected and resolved.
    when: Pactwright eval runs the core cases.
    then: Every core case reports a result under its dimension, naming capability, agent and case, and all eight
      dimensions have at least one case. Canonical files, configuration and lock are byte-identical, and results
      exist only as generated artefacts outside the Project Graph.
    verify:
      automated: [eval.core-run]
  AC02:
    covers: [R03]
    cases: [accurate-claim, overstated-work, unrun-verification, failed-verification-reported-passing]
    given: Recorded delivered work and verification results, and scripted Evidence output with the listed relation
      to them.
    when: The Evidence accuracy cases run.
    then: The accurate claim passes. Each other case fails Evidence accuracy and names the claim that does not
      match the record.
    verify:
      automated: [eval.evidence-accuracy]
  AC03:
    covers: [R04]
    cases: [compliant, unauthorised-decision, skipped-gate, invented-transition, evidence-before-closing-review]
    given: Scripted capability output that is compliant or attempts the listed violation.
    when: The lifecycle compliance cases run.
    then: The compliant output passes. Each violation fails lifecycle compliance and names the violated rule,
      and the project is unchanged.
    verify:
      automated: [eval.lifecycle-compliance]
  AC04:
    covers: [R01]
    cases: [missing-required-output, forbidden-mutation]
    given: Scripted output that omits a required output element or attempts a forbidden mutation, such as review
      requesting Evidence.
    when: The core cases run.
    then: The required-output-structure or forbidden-mutation case fails and names the element or mutation;
      the project is unchanged.
    verify:
      automated: [eval.structure-and-mutation]
  AC05:
    covers: [R05]
    given: A case with both a deterministic assertion and a semantic assertion, run once with the deterministic
      assertion failing and once with the semantic judgement failing.
    when: Eval runs.
    then: Each result is labelled deterministic or semantic and reported separately. One kind failing leaves
      the other's result unchanged.
    verify:
      automated: [eval.assertion-kinds]
  AC06:
    covers: [R06]
    cases: [pinned-package-baseline, environment-candidate, unresolvable-baseline, unresolvable-candidate]
    given: A packed fixture pack at 1.0.0 as baseline and a compatible 1.1.0 or a resolved environment as candidate;
      the unresolvable cases name a version or environment that does not exist, while other versions do.
    when: Eval --baseline --candidate runs.
    then: Resolvable comparisons record both sides' exact version, content hash and agent, prompt and direct-skill
      identities. The unresolvable cases fail explicitly, naming the input; no other version is used and no
      comparison is reported.
    verify:
      automated: [eval.baseline-resolution]
  AC07:
    covers: [R07]
    cases: [evidence-accuracy-regression, lifecycle-compliance-regression, unchanged-candidate]
    given: A baseline and a compatible candidate that differ only by a known regression in one agent's prompt
      affecting the listed dimension, or not at all for unchanged-candidate.
    when: Eval --baseline --candidate runs.
    then: Each regression is reported at its affected capability, agent, case and changed prompt, and unaffected
      cases report no regression. The unchanged candidate reports no regressions. No aggregate score is reported
      as the result.
    verify:
      automated: [eval.regression-dimensions]
  AC08:
    covers: [R02, R07]
    given: The candidate eval code, core cases and a comparison report.
    when: Independent review inspects case ownership, result storage and the report format.
    then: Core cases are versioned with the runtime and results stay generated artefacts. The report makes each
      regression reviewable by dimension without relying on an aggregate score.
    verify:
      review: [eval.report-review]
