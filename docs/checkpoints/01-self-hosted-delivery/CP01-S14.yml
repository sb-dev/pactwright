# CP01 Step 14 — Implement `pactwright init` with explicit Agent Pack selection
id: CP01-S14
requires: [CP01-S01, CP01-S05, CP01-S11]
outputs:
  init-command: A pactwright init that gives a repository only Pactwright-owned core configuration and Project
    Graph structure, reported as an incomplete scaffold until an Agent Pack is explicitly selected.
  init-pack-selection: The init --agent-pack <source> option, through which initialisation obtains an explicit compatible
    Agent Pack choice in the agent-pack use source grammar, resolved and validated through the agent-pack use selection
    path rather than a second resolver.
requirements:
  R01:
    source: [DISTRIBUTION#3, CORE#54]
    statement: 'Init shall create only the Pactwright-owned core configuration and Project Graph structure at the
      CORE#54 paths, including a DISTRIBUTION#12 version 1 lock that records the runtime version and, without a selection,
      no pack. An empty graph is an empty specs/nodes/.gitkeep and specs/graph/edges.yml containing `edges: []`. Plain
      init changes no other file and creates no generated directory.'
  R02:
    source: [DISTRIBUTION#3, DISTRIBUTION#14]
    statement: In Checkpoint 1, init shall write configuration with GitHub disabled, create no Pactwright-managed
      GitHub workflow and make no GitHub request.
  R03:
    source: [DISTRIBUTION#3, DISTRIBUTION#5]
    statement: Init without an explicit pack choice shall select no Agent Pack, including an installed @pactwright/standard,
      and never prompts for one. It reports the result as an unactivated scaffold, not as a complete or healthy executable
      environment. The scaffold is a complete load whose empty graph has a Project Graph revision, which validate reports valid,
      and whose lock yields an environment_lock_hash once Step 15 derives it (CP01-S15/AC11); sync, lifecycle run and
      every capability invocation refuse it naming the missing selection.
  R04:
    source: [DISTRIBUTION#3, DISTRIBUTION#5]
    statement: Init shall accept an explicit pack source and target version through --agent-pack <source>, the DISTRIBUTION#3
      init selection input in the DISTRIBUTION#5 source grammar, and resolve, validate and record it through the agent-pack
      use selection path, so that init --agent-pack ends with the configuration, lock and generated output of init followed
      by agent-pack use. An incompatible or unresolvable choice is refused with no scaffold left behind, no pack recorded
      and a package dependency the attempt added removed.
  R05:
    source: [DISTRIBUTION#5]
    statement: Init in a project that already has an explicit pack choice shall preserve that choice and never switch
      Agent Pack identity; a selection named on such an init is refused when it differs from the selected pack, and applied
      through agent-pack use only when no pack is selected.
  R06:
    source: [CORE#54]
    statement: The created paths and configuration shall load through the Step 1 canonical loader without a second
      parser, and the loader shall read back exactly the configuration init wrote.
  R07:
    source: [CORE#56]
    statement: Init shall not stage or commit files. The repository revision stays unavailable until the owner commits
      the scaffold, including specs/nodes/.gitkeep and every required input. An empty records directory that is not
      tracked is not reconstructible, even when git status reports a clean tree.
  R08:
    source: [GUIDE#filesystem-mutation]
    statement: Init shall write its complete scaffold atomically, and an init that names a pack or an Extension validates
      the complete requested composition before keeping any of it. A failure or refusal leaves no partial scaffold and no
      changed unrelated file.
acceptance:
  AC01:
    covers: [R01, R02, R03]
    cases: [empty-repository, unrelated-files]
    given: A temporary Git repository in the listed condition; unrelated-files holds tracked and untracked user files,
      a user .github/workflows/ file and an installed @pactwright/standard.
    when: Init runs without a pack choice.
    then: 'Only the CORE#54 scaffold is created, with an empty specs/nodes/.gitkeep, `edges: []` and a version 1 lock
      holding the runtime version, an empty extensions mapping and no agent_pack, agents or skills. Configuration has no
      agent_pack and GitHub disabled. No Pactwright-managed workflow exists and no GitHub request is attempted. Unrelated
      files are byte-identical. The result reports an unactivated, incomplete scaffold.'
    verify:
      automated: [init.scaffold]
  AC02:
    covers: [R03, R06]
    cases: [loader-roundtrip, empty-graph-revision, validate-passes, sync-refused, lifecycle-run-refused]
    given: A repository initialised by AC01, with @pactwright/standard installed.
    when: The Step 1 canonical loader reads the project; the Project Graph revision is derived; validate, sync and lifecycle
      run are invoked, as listed.
    then: The loader reads the created configuration, lifecycle configuration, lock, records directory and edges as written
      and reports a complete load with an empty graph and no selected pack. The revision is the pg1 empty-graph digest.
      validate exits zero with no rule failure. sync and lifecycle run are refused naming the missing selection, select
      nothing and write no file.
    verify:
      automated: [init.loader-roundtrip]
  AC03:
    covers: [R04]
    cases: [scaffold-then-use, selection-during-init]
    given: Two clean repositories and one compatible complete fixture pack at an explicit source and target version.
    when: scaffold-then-use runs init and then agent-pack use with that source and version; selection-during-init
      runs init --agent-pack with the same source and version.
    then: Both repositories hold identical configuration, lock and generated files, and both select the fixture
      pack at the given version.
    verify:
      automated: [init.explicit-selection]
  AC04:
    covers: [R03, R04, R08]
    cases: [missing-selection, incompatible-selection, unresolvable-source]
    given: A clean repository with unrelated files, @pactwright/standard installed and the package-manager delegation
      seam instrumented; missing-selection runs plain init, incompatible-selection names an installed fixture pack missing
      a required capability, and unresolvable-source names a package the seam cannot install.
    when: Init runs with the listed selection input.
    then: missing-selection creates the scaffold with no pack selected, @pactwright/standard not chosen and the result
      reported as unactivated. incompatible-selection and unresolvable-source are refused with a problem naming the missing
      capability or the package-manager failure; no scaffold file exists, the package manifest and package-manager lock
      are byte-identical after any dependency the attempt added is removed, and no pack is selected. Unrelated files are
      byte-identical in every case.
    verify:
      automated: [init.selection-refusal]
  AC05:
    covers: [R05]
    cases: [plain-reinit, same-selection, differing-selection, select-on-scaffold]
    given: An initialised project with a fixture pack explicitly selected, a valid lock and generated files, and @pactwright/standard
      installed; select-on-scaffold is instead an unactivated scaffold and names a compatible fixture pack.
    when: Init runs again without a pack choice, or with --agent-pack naming the selected pack, a different compatible
      fixture pack, or the pack for select-on-scaffold, as listed.
    then: plain-reinit and same-selection leave configuration, lock, generated files and canonical files byte-identical
      with the fixture pack still selected. differing-selection is refused naming the selected pack and changes nothing.
      select-on-scaffold selects the named pack through agent-pack use and leaves the scaffold's other files byte-identical.
    verify:
      automated: [init.preserve-selection]
  AC06:
    covers: [R07]
    cases: [before-commit, after-owner-commit, gitkeep-not-committed]
    given: A Git repository with one prior commit, initialised by init; after-owner-commit then commits the scaffold
      with .gitkeep; gitkeep-not-committed commits every scaffold file except .gitkeep and deletes the untracked .gitkeep
      so git status is clean.
    when: The index and HEAD are inspected and the repository revision is requested.
    then: Init changed neither the index nor HEAD. The revision is unavailable for before-commit and gitkeep-not-committed,
      naming the untracked or missing input. after-owner-commit resolves, and a clean checkout of its commit loads
      the empty graph.
    verify:
      automated: [init.repository-revision]
  AC07:
    covers: [R08]
    given: A clean repository with unrelated files and a write failure injected after the first scaffold file.
    when: Init runs.
    then: Init reports the failure. No scaffold file remains and unrelated files are byte-identical.
    verify:
      automated: [init.atomic]
  AC08:
    covers: [R04]
    given: The candidate init code.
    when: Independent review traces the handling of the selection input.
    then: Init resolves and validates the choice by calling the agent-pack use selection path, not a second resolver
      or configuration writer, and no init code path prompts for or defaults a pack.
    verify:
      review: [init.selection-reuse]
