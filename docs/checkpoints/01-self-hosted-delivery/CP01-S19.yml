# CP01 Step 19 — Implement Pactwright runtime upgrade and rollback-safe failure
id: CP01-S19
requires: [CP01-S09, CP01-S15, CP01-S16, CP01-S17, CP01-S18]
inputs:
  package-manager-delegation: CP01-S11/package-manager-delegation
outputs:
  runtime-upgrade: pactwright upgrade and pactwright upgrade --to <version>, which replace the runtime through the
    detected project package manager, re-enter through the new runtime as a child process and, through the upgrade
    recovery record, leave the environment valid at the target, runtime-ahead of components that pin an older runtime, or recoverable
    to the previous runtime, except that the entry from a runtime without this protocol, whose package was replaced
    before any record existed, recovers only the previous stores under the installed runtime.
  released-format-migration: The named released-0.0.1-to-owned-stores-v1 migration, which moves a complete released
    0.0.1 project to owner-separated stores and the version 1 lock without partial moves, and writes a legacy-closure
    execution-state document for each Brief with current Evidence and no execution-state document.
requirements:
  R01:
    source: [DISTRIBUTION#15]
    statement: 'The runtime upgrade shall, in order: detect the project package manager; resolve the target release,
      which without --to is the newest pactwright release listed through the delegation seam that is newer than the
      installed runtime and inside the declared pactwright range of the selected pack and of every enabled Extension,
      reporting no change when none exists; write the upgrade recovery record; delegate package replacement to that
      package manager; re-enter by invoking the runtime now installed in the project, resolved from the project''s
      installed package and never from its own module, as a child process handed the record; and, in the new runtime,
      validate the complete environment, run required declared migrations, update .pactwright/lock.yml, run sync and
      validate, and remove the record. When the installed runtime already is the target and the lock records an older
      runtime, upgrade --to <installed version> performs the post-replacement steps itself, writing the record first with
      the lock''s runtime.version as its source version and the post-replacement package files as its package baseline,
      and making no package request; the record''s attempt identifies this path and designates the installed runtime
      as its recovery target. A failure on that path, and upgrade --to <installed version> run while such a record exists
      after an interruption at record creation, after the completed migration or after the lock write, restores the
      recorded configuration, lifecycle, lock and canonical bytes and inventory, requests no package change and removes
      the record, the source package state having been replaced outside Pactwright before any record could capture
      it: the package manifest and package-manager lock equal their recorded post-replacement bytes, every .pactwright/
      file, core store and owner root equals its source bytes and inventory, no record remains, the installed runtime
      reads the project as migration required and a fresh upgrade --to <installed version> starts a new attempt. This
      is the entry from the released 0.0.1 runtime, which has no upgrade command.'
  R02:
    source: [DISTRIBUTION#15]
    statement: Package-manager detection shall prefer the repository's explicit packageManager declaration and otherwise
      use unambiguous lock state. Ambiguous or absent state is refused before any change, and the package manager
      is never switched.
  R03:
    source: [DISTRIBUTION#15, GUIDE#command-ownership]
    statement: Pactwright upgrade shall change the runtime only. It does not change Agent Pack or Extension identity
      or major-upgrade them, their configured constraints stay authoritative, and Pactwright implements no parallel
      package installer.
  R04:
    source: [DISTRIBUTION#15]
    statement: Pactwright upgrade shall target the latest compatible release, and upgrade --to <version> an explicit
      release for forward upgrade or rollback.
  R05:
    source: [DISTRIBUTION#15, GUIDE#filesystem-mutation]
    statement: When a required migration cannot run, a capability is missing, the locks disagree or any step fails,
      the upgrade shall fail clearly without substituting components or reinterpreting canonical state. Canonical
      Project Graph state is never left partially migrated. The upgrade recovery record, Pactwright-owned content at
      a runtime-declared path below .pactwright/ written before package replacement, holds the attempt, the exact previous package manifest, package-manager lock, configuration, lifecycle and lock
      bytes (on the R01 completion path, the post-replacement package files) and, before a migration runs, the previous
      bytes of every canonical file its plan changes or removes and the exact previous path inventory, each entry with
      its type and each root with whether it exists, of every core store and owner root the plan touches or creates; a failure after replacement,
      including a sync or validate failure after a completed migration, restores every recorded byte and the recorded
      inventory, removing every file, directory and other entry the migration created, requests the previous exact runtime through the seam, except that a completion-path record requests no package
      change as R01 narrows, verifies the restored environment loads under its recorded format and removes the record; when that restoration fails the record stays and the report names upgrade --to with the record's designated recovery
      target; retrying it performs the same restoration and removes the record once it succeeds. While the record exists, ordinary mutation and execution refuse, and upgrade accepts only --to naming the record's
      designated recovery target, the previous runtime for a record written before replacement and the installed runtime
      for a completion-path record, writes no new record, performs the restoration the record's path requires and
      removes it; any other invocation is refused naming the record. The runtime never commits
      the record.
  R06:
    source: [CORE#54, DISTRIBUTION#12, DISTRIBUTION#15]
    statement: A released 0.0.1 project shall be recognised as migration required. Before explicit upgrade, ordinary
      load, validate and doctor report its native and migration-required dispositions without writes. Upgrade selects
      released-0.0.1-to-owned-stores-v1 and runs it in the new runtime, entered by installing the current runtime through
      the package manager and running upgrade --to <installed version>, since the released runtime has no upgrade
      command. Acceptance runs against the unchanged published pactwright@0.0.1 artefact acquired exactly through
      the seam, never a rebuilt fixture. Only a complete valid legacy source enters migration; a partial source or
      parse failure does not.
  R07:
    source: [DISTRIBUTION#15]
    statement: The migration shall preserve core IDs, content, actor attribution and conforming core files; move
      only unambiguously owned Extension records and tuples into their owner's declared storage through its declared
      migration, preserving identities, values and exact tuples; retain configured component constraints and lifecycle
      actor-kind and execution settings in their native formats; check the source lock against its installed environment;
      and write an exact version 1 lock with graph declaration and implementation identities.
  R08:
    source: [CORE#55, DISTRIBUTION#15]
    statement: A disabled, removed, ambiguous or unavailable owner, a conflicting target record or tuple, a missing
      owner migration, a malformed or partial source, or a stale policy or base shall block migration before any
      write, naming the prerequisite and preserving every byte. A forced write, validation or sync failure leaves no partial graph move and the complete source environment recoverable,
      bytes and path inventory alike.
  R09:
    source: [CORE#6, DISTRIBUTION#15]
    statement: 'The migration shall move each owner''s legacy records and tuples through that owner''s declared DISTRIBUTION#11
      graph.migrations entry from released-0.0.1 and replace an empty edge document or `edges: null` with `edges: []`
      only after validating that the legacy edge set is empty. It preserves non-Markdown core-store entries, such as .DS_Store, and blocks
      on them until the owner moves or removes them. A legacy scalar whose released value differs under the pinned
      YAML profile needs value-preserving migration or a named prerequisite.'
  R10:
    source: [CORE#56, DISTRIBUTION#15]
    statement: Explicit rollback to 0.0.1 shall be completed by the current runtime, since the released runtime can
      neither run migrations nor read a recovery record; it runs the paired reverse migration owned-stores-v1-to-released-0.0.1,
      moving each enabled owner's records and tuples back through its declared reverse migration, writes the released
      unversioned lock, validates with the released decoders, removes the record and requests package replacement last,
      leaving execution-state and legacy-closure documents in place and reported as unread by the target; afterwards
      the released runtime's own validate passes on the project. A record no declared reverse migration can express,
      inactive or ambiguous owner data, no selected pack and an interrupted upgrade block it before any write; a released-decoder validation failure after the reverse migration restores the reverse-migrated bytes and inventory
      from the record and removes it, and a package replacement that fails afterwards leaves a released-format project
      with no record that the still-installed runtime reads as migration required. Rollback after new canonical work is supported when every record can be
      expressed and never restores pre-migration copies. An older runtime never reads new-format stores. Historical sha256 graph provenance
      is preserved unchanged and never relabelled pg1; the migrated graph may record a new pg1 identity, and no result
      recorded under the old protocol or definition is presented as a result for the migrated state.
  R11:
    source: [CORE#28, CORE#57, DISTRIBUTION#15]
    statement: The released-format migration shall write, within its atomic change set, a CP01-S06/R04 legacy-closure
      execution-state document for each Brief that has current Evidence and no execution-state document, and
      for no other Brief. No other runtime path writes a legacy-closure document.
  R12:
    source: [DISTRIBUTION#15]
    statement: A selected pack or enabled Extension whose declared pactwright range excludes the target shall neither
      refuse the runtime upgrade nor be upgraded or substituted. The runtime is replaced, migrations that do not need
      that component's registration run, the lock records the new runtime with the component's identity unchanged,
      sync and validate are not run, and the upgrade exits zero reporting each such component as action required with
      the constraint change it needs and its owning upgrade command. While the environment is runtime-ahead, agent-pack
      use, agent-pack upgrade and extension upgrade validate the candidate's own runtime compatibility, dependencies
      and the complete capability set against the other components as recorded, lock the candidate, defer sync until
      no component remains runtime-incompatible and report the pending ones; the command repairing the last one runs
      sync, and ordinary execution stays refused until then. An unchanged pin resolves the same version and reports
      nothing changed.
acceptance:
  AC01:
    covers: [R01, R04]
    cases: [compatible-newer, no-newer-release, newer-only-incompatible]
    given: A project on packed fixture runtime 1.0.0 with the delegation seam instrumented and an instrumented runtime
      that records the version and process running each flow step; compatible-newer lists packed 1.1.0 inside the
      selected pack's range, no-newer-release lists nothing newer, and newer-only-incompatible lists packed 1.1.0
      outside the pack's declared range.
    when: Pactwright upgrade runs.
    then: compatible-newer writes the recovery record, has the package manager install 1.1.0, re-enters 1.1.0 as
      a child process resolved from the project's installed package, records validation, migration, lock update, sync
      and validate by that process, locks runtime 1.1.0 and removes the record. The other two cases report that no
      compatible newer release exists and change nothing.
    verify:
      automated: [upgrade.latest-compatible]
  AC02:
    covers: [R04, R05]
    cases: [forward-to, rollback-to]
    given: A project on packed fixture runtime 1.1.0 with packed 1.0.0 and 1.2.0 available.
    when: Upgrade --to runs with 1.2.0 or 1.0.0, as listed.
    then: The listed runtime is installed and re-entered, and the lock and environment are valid at that version.
    verify:
      automated: [upgrade.explicit-target]
  AC03:
    covers: [R02]
    cases: [package-manager-field, lockfile-only, conflicting-lockfiles, no-package-manager-state, field-disagrees-with-lockfile]
    given: A project in the listed package-manager condition.
    when: Pactwright upgrade runs.
    then: The first two cases use the declared or unambiguous package manager. The others are refused before any
      package, configuration, lock or graph change, naming the ambiguity.
    verify:
      automated: [upgrade.package-manager-detection]
  AC04:
    covers: [R03]
    given: A project with a fixture pack and fixture Extension selected, with newer compatible and newer major versions
      of both available.
    when: Pactwright upgrade runs.
    then: Only the runtime changes. Pack and Extension configuration, sources and locked versions are unchanged.
    verify:
      automated: [upgrade.component-identity]
  AC05:
    covers: [R05]
    cases: [missing-capability, package-replacement-failure, migration-failure, sync-failure, validation-failure,
      migration-then-sync-failure, migration-then-validation-failure, interrupted-after-migration, interrupted-after-lock-write,
      restoration-failure,
      interrupted-after-replacement, other-target-refused]
    given: A valid project on packed runtime 1.0.0 with the delegation seam instrumented, and a target 1.1.0 with the
      listed defect or injected failure; the three migration-then cases use a packed 1.1.0 runtime that declares a format-changing
      migration of a core store, which completes before the injected sync or validate
      failure or the process stop, interrupted-after-lock-write stopping after the new lock is written and before sync; restoration-failure injects a failure into the seam's restore request after a
      validation failure; interrupted-after-replacement stops the process between package replacement and re-entry;
      other-target-refused continues it with packed 1.2.0 also available.
    when: Pactwright upgrade runs to 1.1.0; other-target-refused then runs upgrade --to 1.2.0 and upgrade without --to.
    then: The first five cases fail clearly, restore configuration, lifecycle, lock and package state from the recovery
      record, request the previous exact runtime through the seam, remove the record and leave the graph byte-identical.
      migration-then-sync-failure and migration-then-validation-failure additionally restore every canonical file the
      migration changed byte-identically, restore the recorded path inventory so that no file, directory or other entry
      the migration created survives, and leave the 1.0.0 runtime loading the project
      completely under the old format. interrupted-after-migration, interrupted-after-lock-write and interrupted-after-replacement leave the record;
      doctor reports an interrupted upgrade with upgrade --to 1.0.0 as the remediation, ordinary mutation and execution
      refuse, and upgrade --to 1.0.0 writes no new record, restores the recorded bytes and inventory including the migrated files,
      requests the previous exact runtime through the seam, recovers a valid environment and removes the record. restoration-failure leaves the record, names upgrade --to
      1.0.0, and that command completes the recovery. other-target-refused is refused both times naming the record,
      with everything byte-identical.
    verify:
      automated: [upgrade.failure-recovery]
  AC06:
    covers: [R06]
    given: A complete released 0.0.1 project, created and last validated by the published pactwright@0.0.1 artefact
      acquired exactly through the seam, with core records, an enabled fixture Extension's records in specs/nodes/,
      its tuples in specs/graph/edges.yml, configuration version 1, lifecycle version 1 with stages and the unversioned
      lock.
    when: Load, validate and doctor run on the current runtime before upgrade.
    then: Each reports the native and migration-required dispositions, and no file changes.
    verify:
      automated: [upgrade.legacy-diagnosis]
  AC07:
    covers: [R06, R07]
    cases: [migrates, completion-migration-failure, completion-validation-failure, completion-interrupted-after-record,
      completion-interrupted-after-migration, completion-interrupted-after-lock-write, completion-other-target-refused,
      completion-restoration-failure]
    given: The AC06 project with the published 0.0.1 artefact installed and the current runtime packed; completion-migration-failure
      injects a write failure inside the migration, completion-validation-failure a validation failure after it,
      and the three interrupted cases stop the process just after the record is written, after the completed migration
      and after the lock write; completion-other-target-refused continues completion-interrupted-after-migration; completion-restoration-failure
      injects a filesystem failure into the restoration that follows a validation failure, then retries; each records the package manifest and package-manager lock bytes after the package-manager step.
    when: The published 0.0.1 CLI's validate is invoked and passes on the project; then the current runtime is installed
      through the package manager and upgrade --to its version runs under it, the released runtime having no upgrade
      command. The interrupted cases then run doctor and upgrade --to the installed version; completion-other-target-refused
      instead runs upgrade --to 0.0.1 and upgrade without --to.
    then: completion-migration-failure and completion-validation-failure fail clearly naming the injected step. In the
      interrupted cases doctor reports an interrupted upgrade naming upgrade --to the installed version, and that command
      writes no new record and requests no package change. Every failure case and the three interrupted cases end with every .pactwright/
      file, core store and owner root byte-identical in content and path inventory to the AC06 source, no entry the
      migration created surviving, the package manifest and package-manager lock byte-identical to their recorded
      post-replacement bytes, no record, and the installed current runtime reading the project as migration required;
      completion-interrupted-after-lock-write then completes the migration on a fresh upgrade --to the installed version.
      completion-other-target-refused is refused both times naming the record, with everything byte-identical. completion-restoration-failure
      leaves the record after the failed restoration, doctor names upgrade --to the installed version, upgrade --to
      0.0.1 is refused naming the record, and the retry requests no package change, restores exact bytes and path inventory
      and removes the record. migrates
      writes the record first, with 0.0.1 as its source version and the post-replacement package files as its baseline,
      makes no package request, runs released-0.0.1-to-owned-stores-v1 and leaves no record. Core files are unchanged, Extension records
      and tuples are in the owner's storage with identities and tuples preserved, configuration and lifecycle keep their
      settings, the lock is an exact version 1 lock and validate passes.
    verify:
      automated: [upgrade.released-migration]
  AC08:
    covers: [R06, R08]
    cases: [disabled-owner, removed-owner, ambiguous-owner, target-collision, missing-owner-migration, malformed-source,
      partial-source, stale-policy, stale-base, forced-write-failure, forced-validation-failure, forced-sync-failure]
    given: The AC06 project with only the listed condition or injected failure.
    when: Pactwright upgrade runs to the current runtime.
    then: Each case has its own result naming the prerequisite or failure. No graph move remains, and the complete
      source environment is byte-identical or recoverable, compared as bytes and as the path inventory of every core
      store and owner root.
    verify:
      automated: [upgrade.migration-prerequisites]
  AC09:
    covers: [R09]
    cases: [empty-edge-document, null-edges, non-empty-null-alternative, non-markdown-core-entry, legacy-scalar]
    given: The AC06 project with only the listed legacy condition; non-empty-null-alternative has a malformed edge
      document that also contains tuples.
    when: Pactwright upgrade runs to the current runtime.
    then: 'The first two cases migrate to `edges: []`. non-empty-null-alternative and non-markdown-core-entry block
      with every byte preserved and the path named. legacy-scalar keeps its released value or blocks with a named
      prerequisite.'
    verify:
      automated: [upgrade.compatibility-tightenings]
  AC10:
    covers: [R10]
    cases: [rollback-restores, rollback-after-new-records, rollback-blocked, rollback-validation-fails, rollback-fails]
    given: A project migrated by AC07 whose fixture Extension declares a reverse migration to released-0.0.1, with
      the published 0.0.1 artefact available through the seam; rollback-after-new-records first writes a new core record
      and a new Extension record in the owner-separated format; rollback-blocked holds an Extension record the reverse
      migration cannot express; rollback-validation-fails injects a released-decoder validation failure after the
      reverse migration; rollback-fails injects a failure into the package replacement after the reverse migration.
    when: Upgrade --to 0.0.1 runs.
    then: rollback-restores and rollback-after-new-records reverse-migrate, write the released lock, validate with the
      released decoders and remove the record under the current runtime, then replace the package last, leaving the
      recognised released layout, every record including the new ones readable by 0.0.1, and execution-state documents
      in place; the published 0.0.1 runtime's validate and lifecycle status then pass on the project, and rollback-restores
      yields core files byte-identical to the AC06 source. rollback-blocked names the record and writes nothing. rollback-validation-fails restores the reverse-migrated
      bytes from the record, removes it and leaves the current runtime and stores byte-identical. rollback-fails
      leaves a released-format project with no record, which the still-installed runtime reports as migration required
      and upgrade --to the current version migrates forward again. In every case the 0.0.1 runtime never runs against
      new-format stores.
    verify:
      automated: [upgrade.rollback]
  AC11:
    covers: [R10]
    given: The AC06 project with a replay-base document, as CP01-S09/R06 defines, recording a sha256 graph revision.
    when: It is migrated as in AC07 and replay validation is requested.
    then: The provenance is byte-identical and still sha256. Replay reports the legacy protocol and needs the recorded
      runtime; it is not reported as a pg1 match.
    verify:
      automated: [upgrade.legacy-provenance]
  AC12:
    covers: [R01, R03]
    given: The candidate upgrade code.
    when: Independent review traces package replacement and re-entry.
    then: Packages change only through the detected package manager, every step after replacement runs in the newly
      installed runtime invoked as a child process, except the reverse migration of R10 which runs before replacement,
      the recovery record is written before replacement, holds the pre-migration bytes and path inventory its plan needs
      and is never committed by the runtime, and the completion path from an already-installed target makes no package request, records the post-replacement
      package files as its baseline, marks the record as its own and recovers from it without a package request. Upgrade code
      changes no Agent Pack or Extension identity.
    verify:
      review: [upgrade.ownership]
  AC13:
    covers: [R11]
    cases: [done-lineage, delivering-lineage, already-has-state]
    given: The AC06 project extended with the listed Brief; done-lineage has current Evidence and no execution-state
      document, delivering-lineage has no Evidence and no document, and already-has-state has current Evidence
      and a current-format document.
    when: Pactwright upgrade runs to the current runtime.
    then: done-lineage gains exactly one legacy-closure document for its Brief and validate reports it as unavailable
      verification without failing rule 12. delivering-lineage and already-has-state gain no legacy-closure
      document, and the existing document keeps its bytes.
    verify:
      automated: [upgrade.legacy-closure-markers]
  AC14:
    covers: [R12]
    cases: [pack-pins-source-runtime, extension-pins-source-runtime, component-upgrade-restores, unchanged-pin-no-op,
      pack-then-extension, extension-then-pack, dependent-extensions-pinned, released-migration-with-pinned-pack]
    given: A project on packed runtime 1.0.0 whose selected fixture pack, or enabled fixture Extension, or both, declare
      pactwright 1.0.0 exactly, with packed 1.1.0 and compatible 1.1.0 versions of those components available; component-upgrade-restores
      and unchanged-pin-no-op continue pack-pins-source-runtime; pack-then-extension and extension-then-pack have both
      components pinned; dependent-extensions-pinned has two pinned Extensions, one depending on the other with a declared dependency
      range admitting both versions, and the pack compatible; released-migration-with-pinned-pack is the AC06 project whose pack declares pactwright 0.0.1
      exactly, with the current runtime installed through the package manager.
    when: Upgrade --to 1.1.0 runs, or --to the installed current version for released-migration-with-pinned-pack. component-upgrade-restores
      then sets the pack's constraint to the compatible version and runs agent-pack upgrade; unchanged-pin-no-op runs
      agent-pack upgrade with the pin unchanged; pack-then-extension and extension-then-pack set each component's
      constraint and run its owning upgrade command in the listed order; dependent-extensions-pinned upgrades the
      dependency then the dependent.
    then: The first two cases install and re-enter 1.1.0, lock runtime 1.1.0 with the component's source, version
      and hash unchanged, leave generated files byte-identical, exit zero naming the component as action required
      with its owning upgrade command, and doctor then reports action required for it. Without --to, upgrade reports
      no compatible newer release. component-upgrade-restores locks the new pack version, runs sync, and doctor reports
      healthy. unchanged-pin-no-op reports nothing changed, runs no sync and leaves the environment runtime-ahead.
      In pack-then-extension, extension-then-pack and dependent-extensions-pinned the first command locks its component,
      runs no sync, exits zero and reports the remaining component as pending with its constraint change and owning
      command, doctor stays action required and lifecycle run stays refused; the last command runs sync, and doctor
      reports healthy. released-migration-with-pinned-pack runs released-0.0.1-to-owned-stores-v1, writes the version 1 lock with the pack
      unchanged, leaves no record, exits zero and reports the pack as action required with pactwright agent-pack upgrade.
    verify:
      automated: [upgrade.runtime-ahead]
