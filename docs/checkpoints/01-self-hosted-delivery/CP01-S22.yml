# CP01 Step 22 — Pack runtime and standard Agent Pack
id: CP01-S22
requires: [CP01-S01, CP01-S10, CP01-S20]
outputs:
  packed-archives: The two consumer archives, pactwright and @pactwright/standard, packed from one named candidate
    revision through each package's normal prepack build, with each archive's content identity and the revision
    recorded as the inputs the packed-consumer steps install.
  packing-procedure: The repeatable procedure, pnpm pack at the repository root and pnpm --filter @pactwright/standard
    pack from a clean checkout with no prior build output, that Steps 27 and 28 re-run to pack a later candidate
    revision into equivalent archives.
requirements:
  R01:
    source: [GUIDE#package-metadata, GUIDE#test-layers, SPEC00#3]
    statement: Packing shall run from a clean checkout of one named candidate revision with no prior build output,
      through each package's normal prepack build, and shall produce exactly one archive per publishable package,
      the runtime at the repository root and @pactwright/standard under packages/standard/. No reference code,
      stale build product or file outside the checkout may enter an archive. The candidate revision and each archive's
      SHA-256 content identity are recorded in the run's evidence, and Steps 23, 24 and 27 install exactly those
      archives.
  R02:
    source: [DISTRIBUTION#5, GUIDE#package-metadata, OSS#6]
    statement: The runtime archive's manifest shall declare its dependency on @pactwright/standard as the exact
      version of the standard archive, rewritten from the workspace protocol, so that a consumer installing the
      runtime obtains the pack through the runtime's own dependencies and never through a range, tag or workspace
      reference. The two archives carry the same version.
  R03:
    source: [GUIDE#package-metadata, OSS#25]
    statement: Each archive shall contain only its controlled contents, the built runtime, manifest, LICENSE and
      README for pactwright, and dist, pack.yml, agents, skills, manifest, LICENSE and README for the pack, and no
      test, fixture, checkpoint contract, Project Graph record, configuration, execution-state or source file. Every
      declared main, types, bin and exports target resolves inside its archive, repeating CP01-S01/AC01, AC02 and
      CP01-S10/AC04 on the integrated candidate.
  R04:
    source: [GUIDE#test-layers, SPEC00#4]
    statement: The procedure shall be repeatable and its result identifiable. Repeating it on the same revision yields
      archives with identical entry lists and per-entry content hashes; a revision that changes a packaged file
      yields a different recorded identity for the affected archive. A later step that re-runs the procedure records
      its own revision and identities and never reuses an earlier archive for a changed revision.
acceptance:
  AC01:
    covers: [R01, R03]
    cases: [runtime, standard]
    given: A clean checkout of the candidate revision with no build output, and the listed package.
    when: The package is packed through the procedure and the archive inspected.
    then: Packing runs the prepack build and produces one archive whose manifest names the package and its version,
      whose every main, types, bin and exports target resolves inside the archive, whose entry list holds only the
      R03 contents, and whose SHA-256 identity and the candidate revision are recorded.
    verify:
      automated: [pack.archive-contents]
  AC02:
    covers: [R02]
    given: The two archives of one revision.
    when: Their manifests are read.
    then: The runtime manifest's dependency on @pactwright/standard is the exact version of the standard archive,
      with no workspace protocol, range or dist-tag, and both manifests carry the same version.
    verify:
      automated: [pack.dependency-pin]
  AC03:
    covers: [R04]
    cases: [same-revision-repeat, changed-revision]
    given: The procedure run twice on the same revision, or once on that revision and once on a revision differing
      only in one packaged file of one package, as listed.
    when: The archives are compared.
    then: same-revision-repeat yields identical entry lists and per-entry content hashes for both archives. changed-revision
      yields a different recorded identity for the affected archive and an unchanged one for the other, each recorded
      against its own revision.
    verify:
      automated: [pack.identity]
  AC04:
    covers: [R01, R03]
    given: Both archives, the packing log and the candidate revision.
    when: Independent review inspects both archives against the revision.
    then: The built runtime in the archive was produced by the recorded prepack build of that revision, not reused
      from an earlier build, no source-only path or workspace file is packed, and nothing in either archive comes
      from outside the checkout.
    verify:
      review: [pack.archive-review]
