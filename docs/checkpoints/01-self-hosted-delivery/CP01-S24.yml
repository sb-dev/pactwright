# CP01 Step 24 — Complete one full fixture Delivery
id: CP01-S24
requires: [CP01-S07, CP01-S08, CP01-S09, CP01-S12, CP01-S13, CP01-S16, CP01-S22, CP01-S23]
inputs:
  packed-archives: CP01-S22/packed-archives
  consumer-fixtures: CP01-S23/consumer-fixtures
uses: [claude-code-adapter, adapter-commands, runtime-hand-off, mutation-api, evidence-closure-guards, lifecycle-status,
  lifecycle-next, lifecycle-run, validate-command, eval-command]
outputs:
  fixture-delivery: One complete Delivery, Intent → Decision → Contract → Brief → Evidence, completed in the Step 23
    explicit-path fixture through the rendered adapter commands executed by the selected pack's agents, with Contract
    alternatives and execution transcripts kept out of the Project Graph.
  integration-verification: Fresh executed results, on the candidate revision Step 22 packed, of the accepted validation,
    Evidence-closure, adapter-boundary, evaluation and installed-Extension criteria this contract names, together
    with the packed consumer's own proof of the validation rules, closure guards, mutation boundaries and lifecycle
    commands it can exercise.
requirements:
  R01:
    source: [CORE#3, CORE#46, CORE#47, CORE#53, DISTRIBUTION#14, PRINCIPLES#10, SPEC00#3]
    statement: 'In the explicit-path fixture the seven rendered commands shall run in order, /capture-intent with the
      Intent "Create one small repository artefact that proves the complete Pactwright Delivery lifecycle.", /propose-contracts,
      /approve-contract, /write-brief, /deliver-brief, /review and /prepare-evidence, through the Claude Code adapter
      session the run configuration names, whose provider, model, skill and selected-pack identities are recorded
      as evidence. Each command reaches the runtime only through the hand-off commands. This is the first execution
      of the pack''s agents by a real model in Checkpoint 1; no scripted result stands in for an agent.'
  R02:
    source: [CORE#9, CORE#27, CORE#49, SPEC00#3]
    statement: /approve-contract shall run under the fixture's released policy, manual with actor kind human. The
      proceed Decision, its selected alternative and notes, is authorised by the approving human the run configuration
      names, whose identity is recorded unchanged as decided_by; no agent or automation actor is substituted and
      the policy is not edited to admit one.
  R03:
    source: [CORE#8, CORE#28, CORE#44, CORE#56, CORE#58]
    statement: Afterwards the fixture graph shall hold exactly one lineage, the five records and their resolves, selects,
      decomposes and evidences edges, deriving done. No alternative is a record, execution state lives under .pactwright/
      outside the graph, execution-state writes and transcripts leave project_graph_revision unchanged, the delivered
      artefact exists in the working tree, and the Evidence's verification facts name that artefact and the closing
      Review.
  R04:
    source: [CORE#46, CHECKPOINT#4, DISTRIBUTION#21]
    statement: 'On the fixture consumer, lifecycle status, next and run shall be exercised before the lineage exists
      and at open, contracted, delivery-step, review-step and done: status and next report the position; run stops
      at the manual entries capture-intent and approve-contract reporting the blocking step and required actor
      human, and at each capability-backed automatic responsibility with the missing-invoker execution failure,
      simulating nothing. pnpm pactwright eval on the fixture reports every case as not evaluated, names no invoker,
      exits with failure, simulates no result and writes nothing below .pactwright/.'
  R05:
    source: [CORE#57, CHECKPOINT#4, DISTRIBUTION#3]
    statement: The packed consumer shall prove the CORE#57 rules other than 10, 11, 14 and 15 through the installed
      CLI, each by a copy of the fixture whose only defect is that rule's, with rule 16 using a packed defective
      fixture Extension and rule 17 a replay-base document. Rules 10, 11, 14 and 15 are proven by the repository
      test suite against the built runtime through the Step 6 fixture definitions, and the published archives expose
      no entry point, command or export that loads a fixture shape or policy definition.
  R06:
    source: [CORE#53, CORE#55, CORE#58, DISTRIBUTION#14]
    statement: The packed consumer shall prove, through the installed CLI's hand-off commands with scripted results,
      the seven adapter mutation-boundary cases and the Evidence precondition failures that the released version
      1 policy can express, with the latest-state closure control.
  R07:
    source: [SPEC00#4, CHECKPOINT#4, GUIDE#test-layers, CORE#57]
    statement: 'Before self-hosting, the following accepted criteria shall be re-executed with fresh results on the
      candidate revision Step 22 packed: CP01-S09/AC01, AC03, AC04 and AC06; CP01-S07/AC12 and AC13; CP01-S12/AC02,
      AC03, AC04, AC06 and AC10; CP01-S13/AC01 to AC07; every automated criterion of CP01-S02, CP01-S03, CP01-S04
      and CP01-S05; and CP01-S16/AC10, AC11, AC12, AC13 and AC17, which carry the Stage 1 loading, record, edge,
      lineage and revision cases through the installed fixture Extension, including non-node canonical contributions,
      withdrawal and re-authorisation, actor-policy denial and no-write failure controls. Each is an executed result
      recorded against that revision; neither schema validation of the contract files nor a declared verifier ID
      is evidence.'
acceptance:
  AC01:
    covers: [R01, R02, R03]
    given: The retained explicit-path fixture, the adapter session the run configuration names and the approving
      human it names.
    when: The seven commands run in order through the adapter, /approve-contract selecting one alternative with the
      approver's notes.
    then: The graph validates and holds exactly one lineage of five records and four edges deriving done, the Decision
      records the approver's identity byte for byte, the Brief's execution state records one completed Delivery
      step and a closing Review with outcome may-progress, the artefact exists, the Evidence names it and the Review,
      and the evidence records the session's provider, model, skill and pack identities and each hand-off command's
      dispatch and result.
    verify:
      automated: [delivery.fixture-lineage]
      approval: [delivery.fixture-contract-approval]
  AC02:
    covers: [R03]
    cases: [alternatives, execution-transcript, execution-state]
    given: The fixture after AC01, and the project_graph_revision recorded before the listed material was produced.
    when: The listed material is located and the revision recomputed.
    then: No record or edge exists for any alternative; the transcript and execution-state documents lie outside specs/;
      and the revision equals the one recorded before they were produced, changing only when a canonical record
      or edge was written.
    verify:
      automated: [delivery.non-canonical-state]
  AC03:
    covers: [R04]
    cases: [no-lineage, open, contracted, delivery-step, review-step, done]
    given: The fixture consumer at the listed position.
    when: lifecycle status, next and run are invoked through the installed CLI.
    then: status and next report the position and the permitted action. run at no-lineage and open stops at the
      manual entry reporting the blocking step and required actor human; at contracted, delivery-step and review-step
      it stops with the missing-invoker execution failure naming the responsibility and writes no simulated output;
      at done it performs no step. No canonical file changes in any case.
    verify:
      automated: [delivery.lifecycle-commands-on-consumer]
  AC04:
    covers: [R04]
    given: The fixture consumer with the selected pack.
    when: pnpm pactwright eval runs through the installed CLI.
    then: Every case is reported as not evaluated, the report names no invoker, the exit status is failure, no result
      is simulated, and no file below .pactwright/, specs/ or the generated adapter changes.
    verify:
      automated: [delivery.eval-on-consumer]
  AC05:
    covers: [R05]
    cases: [malformed-core-node, invalid-core-relationship, missing-required-lineage, contradictory-current-records,
      multiple-current-decisions-or-contracts, invalid-brief-contract-lineage, invalid-evidence-brief-lineage, illegal-supersession,
      missing-lifecycle-shape, evidence-before-closing-review, unauthorised-decision, extension-redefines-core, replay-revision-mismatch]
    given: The fixture consumer as a control and a copy whose only defect is the listed rule's, extension-redefines-core
      installing a packed defective fixture Extension and replay-revision-mismatch supplying a replay-base document.
    when: pnpm pactwright validate runs on both through the installed CLI.
    then: The control passes. The copy fails naming the rule and the affected records, inputs or provenance, and
      no file changes.
    verify:
      automated: [delivery.consumer-validation-rules]
  AC06:
    covers: [R05]
    given: Both published archives and the fresh results of CP01-S09/AC01 on the candidate revision.
    when: The archives' entry points, commands and exports are enumerated.
    then: None loads a fixture shape or policy definition, and the rules 10, 11, 14 and 15 results come from the
      repository test suite through the Step 6 definition API on the same revision.
    verify:
      automated: [delivery.no-fixture-entry-point]
  AC07:
    covers: [R06]
    cases: [propose-writes-alternative, deliver-writes-graph, deliver-chooses-transition, review-requests-evidence,
      review-invents-transition, unmapped-review-output, premature-prepare-evidence]
    given: A copy of the fixture consumer at the position the listed CP01-S12/AC03 case needs, and its scripted forbidden
      result.
    when: The command's dispatch and result commands run through the installed CLI.
    then: Each case has the outcome CP01-S12/AC03 states for it, with no canonical record or edge committed and execution
      state advancing only along declared transitions.
    verify:
      automated: [delivery.consumer-mutation-boundaries]
  AC08:
    covers: [R06]
    cases: [superseded-brief, never-reviewed, unreviewed-delivery-change, blocking-closing-review, invalid-lineage,
      latest-state-closure]
    given: A copy of the fixture consumer in the lineage of the same-named CP01-S12/AC10 case, which the released
      version 1 policy can express.
    when: /prepare-evidence runs through the installed CLI's hand-off commands.
    then: Each failure case is refused by the Evidence closure guard before any write, naming the failed precondition,
      and latest-state-closure writes exactly one Evidence and its edge and derives done.
    verify:
      automated: [delivery.consumer-closure-guards]
  AC09:
    covers: [R07]
    given: The candidate revision Step 22 packed and the R07 list of criteria.
    when: Each named criterion's verifier is executed on that revision.
    then: Every named criterion, and every case it declares, has a fresh passing result recorded against that revision,
      and no result is carried from an earlier revision.
    verify:
      automated: [delivery.integration-rerun]
  AC10:
    covers: [R01, R03, R07]
    given: The fixture lineage, the adapter session evidence and the AC09 results.
    when: Independent review inspects them.
    then: The Evidence's delivered-work and verification statements match the artefact and the recorded Review, the
      Brief stays within the Contract, the session identities are recorded rather than claimed, and every AC09 result
      is an executed observation on the packed revision rather than a schema check, a declared verifier ID or a
      producer's claim.
    verify:
      review: [delivery.fixture-review]
