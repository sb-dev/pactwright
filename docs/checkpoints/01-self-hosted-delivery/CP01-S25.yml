# CP01 Step 25 — Initialise the Pactwright repository
id: CP01-S25
requires: [CP01-S01, CP01-S11, CP01-S14, CP01-S17, CP01-S18, CP01-S20, CP01-S24]
outputs:
  self-hosted-project: The Pactwright repository as a valid Pactwright project, holding Pactwright-owned configuration,
    lifecycle policy, version 1 lock, empty Project Graph stores and the rendered Claude Code adapter, created
    by the repository-local CLI with @pactwright/standard explicitly selected from the workspace and landed on
    the default branch with CI / Verify passing, from which the checkpoint's self-hosting obligation applies.
requirements:
  R01:
    source: [OSS#16, PRINCIPLES#3, PRINCIPLES#11, DISTRIBUTION#3, CORE#54]
    statement: 'From the candidate revision, pnpm build shall build the runtime, and the repository-local CLI, which
      runs the built package entry point, shall run in order: init, creating the scaffold; agent-pack use @pactwright/standard,
      resolving the workspace package packages/standard through the project''s installed packages with no package-manager
      request; sync; doctor, exiting zero with the result healthy; validate, exiting zero; lifecycle status, reporting
      no lineage; and pnpm verify, passing. The pactwright package is not added as a dependency of its own repository;
      the runtime is the root package.'
  R02:
    source: [SPEC00#5, CORE#45, CORE#54]
    statement: The step shall start from a candidate that holds no Pactwright project state, so the self-hosted graph
      begins empty. The released 0.0.1 self-hosted records and configuration on the default branch before the candidate
      lands are retained only as Git history; they are neither migrated through CP01-S19's released-format migration
      nor copied into the candidate, because the workspace pack no longer matches their locked identity. This is
      the candidate's retained-and-replaced boundary for project state and needs the owner's approval before the
      step runs.
  R03:
    source: [DISTRIBUTION#12, DISTRIBUTION#13]
    statement: With the pack installed as a workspace link, the package-manager lock identifies no version for it,
      so lock agreement rests on the runtime version, which is the root package's version, and on the pack's content
      identity against the linked directory. The lock records the configured source @pactwright/standard, the workspace
      pack's exact version and content hash and each agent and skill hash, and yields an environment_lock_hash. A
      change to packages/standard content is reported by doctor and refused by sync until agent-pack use @pactwright/standard
      re-locks it.
  R04:
    source: [DISTRIBUTION#14, OSS#16, GUIDE#filesystem-mutation]
    statement: A second sync shall change no file. The committed self-hosting state consists only of Pactwright-owned
      files, .pactwright/config.yml, lifecycle.yml and lock.yml, specs/nodes/.gitkeep, specs/graph/edges.yml and
      the rendered files under .claude/, with no execution-state document or generated report, and no user-authored
      file changes. No Pactwright-owned file is written by hand.
  R05:
    source: [GUIDE#github-actions, GUIDE#repository-changes, CHECKPOINT#explicitly-out-of-scope, SPEC00#3]
    statement: The self-hosting state shall land on the default branch through a pull request merged by the repository
      owner, with CI / Verify succeeding on the pull request and on the resulting default-branch commit, the first
      real default-branch run of the verification workflow. Configuration keeps GitHub disabled, no Pactwright-generated
      workflow exists, and the required-check state of the default branch is recorded in the run configuration.
  R06:
    source: [CORE#56, CORE#54, GUIDE#replay-provenance]
    statement: After the commit the repository revision shall resolve, every required input including specs/nodes/.gitkeep
      being tracked, and validate on the committed state shall report the repository revision, the pg1 empty-graph
      Project Graph revision and the environment_lock_hash.
  R07:
    source: [PRINCIPLES#3, OSS#16, SPEC00#6]
    statement: This step's acceptance is the checkpoint's self-hosting threshold. From it, the CP01/R02 obligation
      applies to every later step of this checkpoint, including corrective re-runs of earlier steps.
acceptance:
  AC01:
    covers: [R01, R03]
    cases: [build, init, agent-pack-use, sync, doctor, validate, lifecycle-status, verify]
    given: The candidate revision with no Pactwright project state.
    when: The listed command runs through the repository-local CLI, in the R01 order.
    then: build produces the runtime. init creates only the scaffold and reports it unactivated. agent-pack-use records
      source @pactwright/standard, the workspace pack's exact version and content hash and each agent and skill
      hash, with no package-manager request. sync renders the adapter. doctor exits zero and reports healthy. validate
      exits zero. lifecycle-status reports no lineage. verify passes.
    verify:
      automated: [self-host.initialise]
  AC02:
    covers: [R02]
    given: The candidate revision before init, and the default branch's released self-hosted records.
    when: The candidate tree is inspected before and after the step.
    then: Before init no .pactwright/, specs/ or rendered adapter path exists; after the step the graph is empty with
      the pg1 empty-graph revision, and no released record, configuration or lock is present or migrated.
    verify:
      automated: [self-host.start-state]
      approval: [self-host.boundary-approval]
  AC03:
    covers: [R03]
    cases: [independent-resolution, pack-content-change]
    given: The initialised repository; pack-content-change then edits one prompt under packages/standard.
    when: independent-resolution resolves the environment independently and compares; pack-content-change runs doctor,
      sync and then agent-pack use @pactwright/standard.
    then: independent-resolution yields a lock byte-identical to the committed one with the same environment_lock_hash.
      pack-content-change makes doctor report action required naming the content whose hash does not match its
      locked identity and sync refuse, and the re-selection re-locks the new hash, after which doctor is healthy.
    verify:
      automated: [self-host.workspace-lock-agreement]
  AC04:
    covers: [R04]
    cases: [second-sync, owned-files-only]
    given: The initialised repository with its user-authored files.
    when: sync runs again, and the committed change set is enumerated.
    then: second-sync changes no file. owned-files-only shows exactly the Pactwright-owned files, no execution-state
      document or report, and every user-authored file byte-identical.
    verify:
      automated: [self-host.converges]
  AC05:
    covers: [R05, R06]
    given: The pull request carrying the self-hosting state.
    when: The owner merges it and the default-branch commit is inspected.
    then: CI / Verify succeeded on the pull request and on the default-branch commit, the repository revision resolves
      to that commit, validate on a clean checkout of it exits zero reporting the three replay identities, configuration
      keeps GitHub disabled and no Pactwright-generated workflow exists.
    verify:
      automated: [self-host.landed]
      approval: [self-host.landing-authority]
  AC06:
    covers: [R01, R04, R07]
    given: The self-hosting commit, the CLI wiring and the run configuration.
    when: Independent review inspects them.
    then: The repository-local CLI runs the built package entry point, no Pactwright-owned file was authored by hand,
      the pack was selected explicitly, and the run configuration records this step's acceptance as the point from
      which CP01/R02 applies.
    verify:
      review: [self-host.review]
