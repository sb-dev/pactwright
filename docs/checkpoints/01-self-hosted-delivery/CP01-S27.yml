# CP01 Step 27 — Deliver Core Delivery learning material
id: CP01-S27
requires: [CP01-S19, CP01-S22, CP01-S23, CP01-S25, CP01-S26]
uses: [claude-code-adapter, adapter-commands, runtime-hand-off, mutation-api, evidence-closure-guards, validate-command]
outputs:
  learning-material: The README Quick Start, the Getting Started guide and one executable core Delivery example,
    delivered through Pactwright Delivery lineages in the repository's own Project Graph, documenting only behaviour
    proven in this checkpoint, including the core distribution commands the release ships, so that a new user can
    understand, install, execute and upgrade the released 0.0.2 without any Extension.
requirements:
  R01:
    source: [OSS#24, OSS#3, OSS#11, OSS#14, GUIDE#public-product-progression, PRINCIPLES#14]
    statement: Through Delivery lineages with owner-approved Contracts, as in Step 26, the step shall produce or update
      the README Quick Start, the Getting Started guide at docs/getting-started.md linked from the README, and the
      executable core Delivery example at examples/core-delivery/README.md, which takes a fresh repository from
      installation to a completed Intent → Evidence lineage.
  R02:
    source: [DISTRIBUTION#27, DISTRIBUTION#15, DISTRIBUTION#16, GUIDE#command-ownership, PRINCIPLES#14]
    statement: 'Across the three documents the material shall cover installation, initialisation with explicit pack
      selection by both init --agent-pack and init followed by agent-pack use and sync, doctor, validate, lifecycle
      status, the seven commands and the mutation each is permitted, pactwright upgrade and upgrade --to, agent-pack
      upgrade, and the honest posture of lifecycle run and eval without an invoker. It documents no Extension, GitHub
      integration or Project Intelligence as available, and every command it names exists in the shipped CLI.'
  R03:
    source: [OSS#18, PRINCIPLES#7, GUIDE#public-content-authority-before-project-intelligence]
    statement: Each Contract shall state the claims the material may make; the model invents no identity, positioning
      or capability claim, and every documented behaviour is proven by an accepted criterion result or the packed-consumer
      evidence of this candidate revision.
  R04:
    source: [GUIDE#npm-release-model]
    statement: Every install instruction in the material shall name the exact version pactwright@0.0.2, since latest
      stays at the bootstrapped 0.0.1 until 0.1.0.
  R05:
    source: [OSS#14, GUIDE#test-layers]
    statement: The guide and the example shall be followed in a clean packed-consumer fixture built by the Step 23
      procedure from archives packed from this candidate revision, with the exact-version install mapped to those
      archives. Every command executes as documented, the example ends with a validated done lineage, the upgrade
      instructions are exercised, pactwright upgrade reporting no compatible newer release and agent-pack upgrade
      reporting nothing changed, and README, guide and example agree on one command surface.
  R06:
    source: [PRINCIPLES#14, PRINCIPLES#15]
    statement: A reader with no prior Pactwright context shall be able to discover, understand, install, execute and
      upgrade from the shipped material alone; every place the reader needs knowledge the material does not ship
      is a content gap that fails this step.
  R07:
    source: [OSS#16, CHECKPOINT#exit-gate]
    statement: The material and its lineages shall be in the default-branch source before Step 28 tags the release.
acceptance:
  AC01:
    covers: [R01, R03]
    given: The self-hosted project, the adapter session and the repository owner as approving actor.
    when: The Delivery lineages for the material run through the seven commands.
    then: Each lineage validates and derives done with the owner recorded as decider, the three documents exist at
      their paths, the README links the guide and the example, each Contract states the authorised claims, and the
      documents changed only during Delivery steps.
    verify:
      automated: [content.learning-path-lineage]
      approval: [content.learning-path-contract-approval]
  AC02:
    covers: [R02, R04]
    cases: [readme, guide, example]
    given: The listed document and the shipped CLI's command surface.
    when: The command-surface check reads it.
    then: Every command the document names exists in the shipped CLI, the R02 coverage set is present across the
      three documents, every install instruction names pactwright@0.0.2, and no Extension, GitHub integration or
      Project Intelligence is documented as available.
    verify:
      automated: [content.command-surface]
  AC03:
    covers: [R02, R04]
    cases: [unknown-command, floating-install, surface-disagreement, future-capability]
    given: A copy of one document whose only defect is the listed one, a command absent from the shipped CLI, an
      install line without the exact version, a command sequence that contradicts another document, or a future
      capability documented as available.
    when: The command-surface check reads the copy.
    then: The check fails naming the document and line.
    verify:
      automated: [content.command-surface-controls]
  AC04:
    covers: [R05]
    cases: [guide-walkthrough, example-walkthrough, upgrade-instructions]
    given: A clean fixture built from archives of this candidate revision with the exact-version install mapped to
      them.
    when: The listed material is followed command by command.
    then: guide-walkthrough and example-walkthrough succeed with the documented results, the example ending with
      validate exiting zero on a done lineage. upgrade-instructions run pactwright upgrade, which reports no compatible
      newer release, and agent-pack upgrade, which reports nothing changed, leaving the fixture byte-identical.
    verify:
      automated: [content.material-executes]
  AC05:
    covers: [R06]
    given: The shipped material and a clean fixture, and a reviewer given no context beyond them.
    when: The reviewer follows the material to install, run one Delivery and upgrade.
    then: Every step succeeds from the material alone. The reviewer records each point where knowledge outside the
      material was needed; the step passes only when that record is empty.
    verify:
      review: [content.new-user-review]
  AC06:
    covers: [R03, R07]
    given: The lineages, the delivered documents, the AC04 results and the default-branch state before Step 28.
    when: Independent review inspects them.
    then: Every claim is authorised by its Contract and proven, nothing was invented, the Evidence statements match
      the diffs and the AC04 executions, and the material and lineages are on the default branch.
    verify:
      review: [content.learning-path-review]
      approval: [content.learning-path-landing-authority]
