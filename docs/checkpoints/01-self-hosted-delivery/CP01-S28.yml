# CP01 Step 28 — Publish the corrective release and prove a real released baseline
id: CP01-S28
requires: [CP01-S13, CP01-S20, CP01-S21, CP01-S22, CP01-S25, CP01-S26, CP01-S27]
inputs:
  release-workflow: CP01-S21/release-workflow
  baseline-comparison: CP01-S13/baseline-comparison
outputs:
  corrective-release: pactwright@0.0.2 and @pactwright/standard@0.0.2 published to npm under the tag next from
    the accepted, tagged default-branch source through the trusted release workflow, its first trusted publish,
    with 0.0.1 retained as the released baseline.
  released-baseline-comparison: The pactwright eval comparison of the published @pactwright/standard@0.0.1 baseline
    against the 0.0.2 candidate, resolving the released baseline exactly through the package-manager delegation
    seam and reporting the changed components and not-comparable results of a run without an invoker.
requirements:
  R01:
    source: [GUIDE#npm-release-model, GUIDE#preparing-a-development-release, GUIDE#repository-changes]
    statement: A release pull request on the default branch shall set every publishable package version to 0.0.2,
      refresh the lockfile, pass pnpm verify and pnpm publish -r --dry-run --tag next --access public, and update
      the CHANGELOG's 0.0.2 entry with the release date from accepted Evidence recorded in the tagged source's Project
      Graph, citing no Evidence outside it. It changes nothing else and is merged by the owner with CI / Verify
      passing.
  R02:
    source: [GUIDE#trusted-release-workflow, GUIDE#first-publication-of-a-package, SPEC00#4]
    statement: The publish authority shall be the owner's push of the tag v0.0.2 to the accepted default-branch release
      commit, whose tree holds the Step 25, 26 and 27 lineages and material. The v0.0.2 run is the first publish
      through trusted publishing; nothing is published interactively, and a rerun publishes nothing the registry
      already holds.
  R03:
    source: [GUIDE#trusted-release-workflow, GUIDE#release-failure]
    statement: 'The run shall succeed through registry verification, and its receipts are the run identity, the npm-release
      deployment record and each published version''s provenance attestation naming this repository and workflow.
      Afterwards the registry holds, for both packages, exactly the versions 0.0.1 and 0.0.2, next at 0.0.2 and
      latest at 0.0.1.'
  R04:
    source: [DISTRIBUTION#24, DISTRIBUTION#15, PRINCIPLES#17]
    statement: 'From the Pactwright repository root, pnpm pactwright eval --baseline @pactwright/standard@0.0.1 --candidate
      @pactwright/standard@0.0.2 shall acquire the baseline through the delegation seam into an isolated location,
      leaving the project''s packages and locks byte-identical, resolve it exactly to the published 0.0.1 content
      and report its declared runtime 0.0.1 as an incompatible component; resolve the candidate to 0.0.2 with the
      published content identity; report every candidate-dependent assertion as not comparable, name no invoker
      or judge, list the agent, prompt and skill components that changed between the sides and no regression; exit
      zero; and write its report only to standard output or the named path.'
  R05:
    source: [GUIDE#test-layers, DISTRIBUTION#3, DISTRIBUTION#5]
    statement: A clean fixture outside the workspace shall run pnpm add -D pactwright@0.0.2 from the registry with
      no override, then the Step 23 explicit path, the pack resolving from the runtime's dependency at exactly 0.0.2,
      doctor exiting zero and validate and lifecycle status passing.
  R06:
    source: [CHECKPOINT#exit-gate, OSS#16, SPEC00#4]
    statement: The tagged commit shall be the candidate's final accepted revision, and its tree shall contain the
      README Quick Start, docs/getting-started.md, examples/core-delivery/README.md and the Evidence records of Steps
      26 and 27.
  R07:
    source: [GUIDE#release-failure, GUIDE#npm-release-model]
    statement: Before any publication a failed run is fixed and rerun, and an unpublished tag may be deleted and recreated
      by the owner on the corrected commit. After any publication the version is consumed; a defect in the published
      0.0.2 is fixed forward by repeating this step with the next unused 0.0.x under an owner-approved amendment
      of this checkpoint's Release line, never by unpublishing, overwriting or moving latest.
acceptance:
  AC01:
    covers: [R01]
    cases: [versions, lockfile, verify, dry-run, changelog]
    given: The release pull request.
    when: The release preparation check reads it and its checks run.
    then: versions shows every publishable manifest at 0.0.2. lockfile shows the committed lockfile refreshed and
      frozen installation succeeding. verify passes. dry-run succeeds for both packages under next with nothing written.
      changelog shows the 0.0.2 entry dated, and every Evidence it cites resolving in the pull request's Project
      Graph.
    verify:
      automated: [release.preparation]
      approval: [release.preparation-landing-authority]
  AC02:
    covers: [R01]
    cases: [changelog-unknown-evidence, changelog-undated, version-mismatch, unrelated-change]
    given: A copy of the release pull request whose only defect is the listed one, a cited Evidence ID absent from
      the graph, an undated entry, one manifest not at 0.0.2, or a change outside version, lockfile and CHANGELOG.
    when: The release preparation check reads it.
    then: The check fails naming the defect.
    verify:
      automated: [release.preparation-controls]
  AC03:
    covers: [R02, R03]
    given: The merged release commit on the default branch.
    when: The owner pushes v0.0.2 and the run completes.
    then: The run succeeded through registry verification, its npm-release deployment record exists, both versions
      resolve at 0.0.2 under next with attestations naming this repository and workflow, latest is 0.0.1, each package
      lists exactly 0.0.1 and 0.0.2, and no interactive publish occurred.
    verify:
      automated: [release.published-versions]
      approval: [release.publish-authority]
  AC04:
    covers: [R04]
    cases: [baseline-acquisition, baseline-identity, incompatible-runtime-reported, not-comparable, changed-components,
      exit-status, report-location]
    given: The Pactwright repository at the release commit after publication.
    when: The comparison command runs.
    then: baseline-acquisition shows one acquisition request into an isolated location and the project's packages
      and locks byte-identical. baseline-identity records the published 0.0.1 version and content hash. incompatible-runtime-reported
      names the baseline's declared runtime 0.0.1. not-comparable shows every candidate-dependent assertion not comparable
      with no invoker or judge named. changed-components lists each changed agent, prompt and skill and no regression.
      exit-status is zero. report-location shows the report on standard output or the named path and nothing below
      .pactwright/.
    verify:
      automated: [release.baseline-comparison]
  AC05:
    covers: [R05]
    given: A clean fixture outside the workspace after publication.
    when: pnpm add -D pactwright@0.0.2 and the explicit path run.
    then: The runtime and the pack install from the registry at exactly 0.0.2 with no override, and init, agent-pack
      use, sync, doctor, validate and lifecycle status succeed as in CP01-S23/AC01.
    verify:
      automated: [release.published-consumer]
  AC06:
    covers: [R06]
    given: The tag v0.0.2.
    when: Its tree and commit are inspected.
    then: The commit is the candidate's final accepted revision, and the tree holds the README Quick Start, docs/getting-started.md,
      examples/core-delivery/README.md and the Step 26 and 27 Evidence records.
    verify:
      automated: [release.tagged-source]
  AC07:
    covers: [R02, R03, R07]
    given: The run log, deployment record, attestations, registry reads and the release records.
    when: Independent review inspects them.
    then: Each receipt is an observed record, not a claim; no interactive publish, duplicate publish, unpublish or
      dist-tag move occurred; and any failure was handled under R07.
    verify:
      review: [release.receipts-review]
