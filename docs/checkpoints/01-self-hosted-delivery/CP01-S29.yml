# CP01 Step 29 — Establish the minimum Kakeibo consumer root and install `0.0.2`
id: CP01-S29
requires: [CP01-S28]
inputs:
  corrective-release: CP01-S28/corrective-release
outputs:
  kakeibo-consumer-root: The Kakeibo repository holding the minimum pnpm package/workspace root, with pactwright@0.0.2
    installed from the registry as a development dependency, @pactwright/standard explicitly selected, the adapter
    rendered and core Delivery only, every pre-existing Kakeibo file unchanged and the public-repository foundation
    inventoried for Step 30.
requirements:
  R01:
    source: [CHECKPOINT#stage-10--prove-the-published-release-on-kakeibo, KAKEIBO_PROFILE#5, GUIDE#execution-location, SPEC00#3]
    statement: 'The step shall run in the Kakeibo repository root the run configuration names, from a recorded starting
      revision. The only pre-Pactwright bootstrap is package.json, with name kakeibo, version 0.0.0 and private
      true, and pnpm-workspace.yaml listing apps/* and packages/*, each created only when absent; an existing file
      is preserved byte for byte and its adopted configuration used. No application package, Hono service, database
      code, R2 or Workflow infrastructure, Turborepo pipeline, analytics or provider code is created.'
  R02:
    source: [DISTRIBUTION#3, DISTRIBUTION#5, DISTRIBUTION#14, DISTRIBUTION#16]
    statement: 'The step shall run pnpm add -D pactwright@0.0.2, installing exactly that version from the registry
      with no override or local archive, then pnpm pactwright init, agent-pack use @pactwright/standard, which
      resolves the pack from the runtime''s dependencies at exactly 0.0.2 with no package-manager request, sync,
      validate, which exits zero, and lifecycle status, which reports no lineage; doctor exits zero with the result
      healthy.'
  R03:
    source: [KAKEIBO_PROFILE#5, KAKEIBO_PROFILE#4, CHECKPOINT#explicitly-out-of-scope]
    statement: Afterwards the only changed or added paths shall be the bootstrap files where created, the package
      manifest's development dependency and packageManager fields where the package manager wrote them, the package-manager
      lockfile, an ignore rule for node_modules where absent, and the Pactwright-owned files .pactwright/config.yml,
      lifecycle.yml and lock.yml, specs/nodes/.gitkeep, specs/graph/edges.yml and the rendered files under .claude/.
      Every Kakeibo specification and other repository-authored file is byte-identical, configuration enables no
      Extension and keeps GitHub disabled.
  R04:
    source: [KAKEIBO_PROFILE#5, PRINCIPLES#3]
    statement: The step shall record, for README.md, LICENSE with the Apache-2.0 text, SECURITY.md with a private
      disclosure route, CONTRIBUTING.md, the canonical docs/specs/ authority set, working deterministic tests and
      safe synthetic financial fixtures, whether each is present at the starting revision. It creates none of them;
      an absent item is delivered through Kakeibo Delivery in Step 30.
  R05:
    source: [SPEC00#3, SPEC00#4, KAKEIBO_PROFILE#2, GUIDE#kakeibo-acceptance-model]
    statement: Writes to the Kakeibo repository and the commit of this state to its default branch shall be authorised
      by the Kakeibo owner. The run configuration records the revisions of the Kakeibo canonical specifications,
      docs/specs/README.md and the 02, 05 and 06 specifications, that govern Stage 10; retained Kakeido snapshots
      in Pactwright are not read as authority.
  R06:
    source: [PRINCIPLES#8, PRINCIPLES#9, SPEC00#4]
    statement: The evidence shall record the installed runtime and pack versions and content identities, the resulting
      .pactwright/lock.yml and environment_lock_hash, and that every command ran the published package's built
      entry point from Kakeibo's node_modules.
acceptance:
  AC01:
    covers: [R01, R02]
    cases: [bootstrap-absent, bootstrap-present]
    given: The Kakeibo repository at its starting revision, and for bootstrap-present a fixture copy of it that already
      holds a package.json and pnpm-workspace.yaml with content differing from the step's defaults.
    when: The step's commands run.
    then: bootstrap-absent creates the two bootstrap files with the specified content; bootstrap-present preserves
      the existing files byte for byte and uses their configuration. In both, pactwright@0.0.2 is installed from
      the registry, init reports a scaffold, agent-pack use locks @pactwright/standard at exactly 0.0.2 with no
      package-manager request, sync renders the adapter, validate exits zero, lifecycle status reports no lineage
      and doctor exits zero reporting healthy.
    verify:
      automated: [kakeibo.consumer-root]
  AC02:
    covers: [R03]
    given: The Kakeibo tree at the starting revision and after the step.
    when: The two trees are compared.
    then: The differences are exactly the R03 paths, every specification and other repository-authored file is byte-identical,
      configuration has an empty extensions mapping and GitHub disabled, and no application package, service, database,
      infrastructure, pipeline, analytics or provider file exists that the starting revision lacked.
    verify:
      automated: [kakeibo.boundary]
  AC03:
    covers: [R02, R06]
    given: The Kakeibo repository after the step.
    when: The installed packages, lock and command processes are inspected.
    then: pactwright and @pactwright/standard are installed at exactly 0.0.2 with the published content identities,
      the lock records them with an environment_lock_hash, and each command resolved its entry point inside Kakeibo's
      node_modules.
    verify:
      automated: [kakeibo.published-runtime]
  AC04:
    covers: [R04]
    given: The Kakeibo repository at the starting revision.
    when: The foundation inventory runs.
    then: It records present or absent for each R04 item with the evidence it read, and creates or changes no file.
    verify:
      automated: [kakeibo.foundation-inventory]
  AC05:
    covers: [R01, R05]
    given: The Kakeibo commit carrying this state, the run configuration and the inventory.
    when: The Kakeibo owner authorises the writes and the commit, and independent review inspects them.
    then: The commit is on Kakeibo's default branch under the owner's authority, the recorded specification revisions
      are the current canonical ones, no Kakeido snapshot was read as authority, and no Checkpoint 2 application
      or infrastructure concern was implemented.
    verify:
      approval: [kakeibo.install-authority]
      review: [kakeibo.consumer-review]
