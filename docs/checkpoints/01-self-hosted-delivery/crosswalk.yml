# B1 Q01-Q04; B2 Q05-Q09,Q18; B3 Q10-Q13,Q19; B4 Q14-Q16; B5 Q17; B6 Q20.
# Applied clauses: Core v3 / Checkpoint 1 v20. Mandatory checks and independent
# acceptance remain pending where the batch records say so; no question is deleted.
#
# Stage 2 (Q21-Q33) is a T1 conversion drafted against Core v3. Its open
# questions are unresolved inputs to T2 review; no specification was amended.
#
# Stage 3 (Q34-Q40) is a T1 conversion drafted against Core v3 and Distribution
# v2. Its open questions are unresolved inputs to T2 review; no specification
# was amended.
