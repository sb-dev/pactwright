    text: "Repeat the Step 7 guard matrix through each mutating command (`/capture-intent`, `/approve-contract`, `/write-brief`, `/prepare-evidence`): stale graph or policy/config/lock base, record rewrite/removal/re-identification, core-edge replacement/removal, incomplete load and disallowed actor kind must not commit or partially write."
    covered_by: [CP01-S12/R11, CP01-S12/AC04]
  - key: S12.verify.5
    text: "Exercise the relevant valid control for each command through the same runtime API, rather than only asserting prompt text."
    covered_by: [CP01-S12/AC04]
  - key: S12.verify.6
    text: "An adapter running on behalf of an allowed human records that human attribution unchanged; a different well-formed identity of that allowed kind remains permitted."
    covered_by: [CP01-S12/R05, CP01-S12/AC05]
  - key: S12.verify.7
    text: "For `/approve-contract`, repeat reject/defer withdrawal, fresh re-authorisation over the last Contract in the withdrawn chain, existing-Contract re-selection refusal and missing-supersession refusal."
    covered_by: [CP01-S12/R05, CP01-S12/AC06]
  - key: S12.verify.8
    text: "No public API or adapter may bypass the checks already proved at Step 7."
    covered_by: [CP01-S12/R11, CP01-S12/AC04, CP01-S12/AC09]
  - key: S13.references
    text: "Spec 02 evaluation and baseline/regression reporting."
    covered_by: [CP01-S13/R01, CP01-S13/R02, CP01-S13/R06, CP01-S13/R07]
  - key: S13.run.1
    text: "Implement `pactwright eval` with core responsibility cases for Contract fidelity, scope discipline, Brief quality, Review quality/defect detection, Evidence accuracy and lifecycle compliance, plus required output structure and forbidden mutation."
    covered_by: [CP01-S13/R01, CP01-S13/AC01, CP01-S13/AC04]
    note: "Who performs semantic judgement and how capabilities are executed during eval is Q39."
  - key: S13.run.2
    text: "Evidence accuracy cases compare claimed delivered work and verification with actual recorded results."
    covered_by: [CP01-S13/R03, CP01-S13/AC02]
  - key: S13.run.3
    text: "Lifecycle compliance cases cover authority, Gate stopping, valid transitions and successful closing Review before Evidence."
    covered_by: [CP01-S13/R04, CP01-S13/AC03]
  - key: S13.run.4
    text: "Implement the canonical comparison surface:"
    covered_by: [CP01-S13/R06, CP01-S13/AC06]
  - key: S13.run.5
    text: "pactwright eval --baseline <released-pack-or-baseline> --candidate <candidate-pack-or-environment>"
    covered_by: [CP01-S13/R06, CP01-S13/AC06]
    note: "Which inputs --baseline and --candidate accept and what counts as a regression is Q40."
  - key: S13.run.6
    text: "Keep deterministic assertions separate from semantic judgement."
    covered_by: [CP01-S13/R05, CP01-S13/AC05]
  - key: S13.run.7
    text: "Report regressions by meaningful dimensions such as capability, agent, evaluation case and changed Agent Pack/prompt/direct-skill environment."
    covered_by: [CP01-S13/R07, CP01-S13/AC07, CP01-S13/AC08]
  - key: S13.run.8
    text: "Do not compute one opaque aggregate score."
    covered_by: [CP01-S13/R07, CP01-S13/AC07, CP01-S13/AC08]
  - key: S13.run.9
    text: "Before the first public release, prove comparison mechanics with exact fixture/pinned package inputs. After `0.0.1` is published, Step 28 must prove resolution against the real released baseline."
    covered_by: [CP01-S13/R06, CP01-S13/AC06]
    allocated_to: CP01-S28
    note: "Step 13 uses packed fixture packs; Step 28 resolves the real released @pactwright/standard@0.0.1 baseline."
  - key: S13.expected.1
    text: "The AI execution environment is evaluable independently from a real Delivery and candidate changes can be compared against an exact baseline."
    covered_by: [CP01-S13/R01, CP01-S13/R06, CP01-S13/AC01, CP01-S13/AC06]
  - key: S13.verify.1
    text: "Run core eval, compare compatible baseline/candidate fixtures and introduce known regressions in Evidence accuracy and lifecycle compliance."
    covered_by: [CP01-S13/AC01, CP01-S13/AC06, CP01-S13/AC07]
  - key: S13.verify.2
    text: "Require each to appear at its affected capability/agent/case dimensions rather than being hidden in an aggregate result."
    covered_by: [CP01-S13/R07, CP01-S13/AC07]
open_questions:
  - id: Q01
    affects: [CP01-S01/R05, CP01-S02/R06, CP01-S03/R01]
    question: "Where does the loader find Pactwright configuration, lifecycle configuration, core records and typed edges, and in which serialisations? Must the layout stay readable by the released 0.0.1 runtime?"
  - id: Q02
    affects: [CP01-S01/R06, CP01-S02/AC05, CP01-S05/R02]
    question: "When an input cannot be parsed, does loading fail as a whole or return the parseable remainder with problems for validate (Step 9) and doctor (Step 18) to report? How are absent inputs and unrecognised files in graph storage treated?"
  - id: Q03
    affects: [CP01-S01/R05, CP01-S01/R07, CP01-S01/R08]
    question: "Should the Step 1 loader accept configuration that declares Extensions or enables GitHub as inert data, reject it, or report it as unsupported?"
  - id: Q04
    affects: [CP01-S01/R01]
    question: "Does the runtime package stay at the repository root or move to packages/pactwright/ as Spec 08 §4 and §6 describe?"
  - id: Q05
    affects: [CP01-S02/R06, CP01-S02/R07, CP01-S02/AC05]
    question: "What is a core record's canonical identity: how is it represented and assigned, is the record type part of it, and what makes one malformed? How is a changed identity of an existing record told apart from removing one record and adding another, and must it be rejected?"
  - id: Q06
    affects: [CP01-S02/R07, CP01-S03/R01]
    question: "What does immutability cover and what is it checked against: every stored record, including an unresolved Intent? The current stored graph or Git history? May a record or typed edge be removed or changed in place?"
  - id: Q07
    affects: [CP01-S02/R07, CP01-S05/R02]
    question: "Is a record's canonical content its stored bytes or a normalised form? Does a formatting-only edit count as an in-place change or change the Project Graph revision?"
  - id: Q08
    affects: [CP01-S02/R04]
    question: "Which items that Spec 01 says Intent, Contract, Brief and Evidence own are mandatory schema rules, and is each a structured field or prose? Are the content exclusions and qualities in Spec 01 §§7, 9, 10, 11 and 14 (what a record must not contain, a concise rationale) schema rules or review judgements?"
  - id: Q09
    affects: [CP01-S02/R05]
    question: "Does a Decision record only the kind of its authorised actor (human, agent, automation) or an actor identity as well?"
  - id: Q10
    affects: [CP01-S03/R03, CP01-S03/R05, CP01-S04/R01]
    question: "Does the core same-type supersedes relation apply to Intents and to Extension-owned node types, or do Extensions register their own supersession relations?"
  - id: Q11
    affects: [CP01-S03/R05, CP01-S04/R06]
    question: "Is branching supersession (one record superseded by several, or superseding several) illegal, and is it rejected by edge validation (Step 3), failed as ambiguous lineage (Step 4) or left to validation rule 8 (Step 9)?"
  - id: Q12
    affects: [CP01-S03/R06]
    question: "Beyond replacing a core relation's endpoint constraints, which registrations count as weakening core constraints, such as relaxing same-type or acyclicity rules or reusing a core relation name?"
  - id: Q13
    affects: [CP01-S03/R03, CP01-S05/R03]
    question: "How are stored edges of an unregistered relation treated, including preserved edges of a disabled or removed Extension: rejected, retained and excluded from the Project Graph revision, or reported?"
  - id: Q14
    affects: [CP01-S04/R01, CP01-S04/R06]
    question: "Are several unsuperseded Briefs for one current Contract, or several Evidence records for one current Brief, an ambiguous lineage or legitimate concurrent work?"
  - id: Q15
    affects: [CP01-S04/R02, CP01-S04/R06]
    question: "May a reject or defer Decision supersede a proceed Decision, and what is the status of the withdrawn proceed Decision's Contract, which has no same-type replacement?"
  - id: Q16
    affects: [CP01-S04/R02]
    question: "Must lineage derivation check a Decision's recorded actor against lifecycle policy, or is unauthorised-Decision detection left to Step 7 guards and Step 9 validation?"
  - id: Q17
    affects: [CP01-S05/R01, CP01-S05/AC01, CP01-S05/AC02]
    question: "Which repository state does the repository revision identify (commit, tree, or commit plus working tree), and how must it behave with uncommitted, untracked or ignored changes or without Git?"
  - id: Q18
    affects: [CP01-S05/R02, CP01-S05/R05]
    question: "Which hash algorithm and canonical serialisation does the Project Graph revision use, and must it be stable across runtime versions and platforms?"
  - id: Q19
    affects: [CP01-S05/R03]
    question: "Step 5 now needs a fixture registration seam for Extension-owned record types. Which step owns that seam (the Step 2 record model or Step 5), and how does Step 16 replace the fixture with installed Extensions?"
  - id: Q20
    affects: [CP01-S01/R05, CP01-S02/R07, CP01-S03/R06, CP01-S04/R01]
    question: "Should the later contracts carry these obligations, which v17 does not state at the named steps: Step 7 mutations refuse in-place rewrites through the Step 2 check; Step 16 re-runs CP01-S03/AC06 to AC09 and exercises Step 4 derivation through the fixture Extension loader, beyond the graph contribution registration and core-redefinition failure its v17 text already requires; Steps 6, 11, 14 and 15 load their real formats through the Step 1 loader?"
  - id: Q21
    affects: [CP01-S06/R02, CP01-S06/R05, CP01-S06/R07, CP01-S06/AC03, CP01-S06/AC04, CP01-S06/AC05, CP01-S06/AC06,
      CP01-S06/AC07, CP01-S07/AC03, CP01-S07/AC12, CP01-S08/AC01, CP01-S08/AC02, CP01-S08/AC03, CP01-S08/AC08,
      CP01-S09/R05]
    question: "Core §27 recognises only the released lifecycle `version: 1` / `stages` policy format and treats an unreleased `version: 2` draft as unsupported, and the built-in direct shape (Core §20) has no Gate or corrective route. Where and in what format does Checkpoint 1 declare lifecycle shapes, Gates, corrective transitions, iteration limits and any escalation at an exhausted limit, so that the Gate, corrective-route and bounded-loop criteria of Steps 6-8 and validation rules 9-11 and 15 have configuration to exercise: built-in shapes only, test-only fixture shapes, or a new explicitly versioned lifecycle schema with its migration?"
  - id: Q22
    affects: [CP01-S06/R03, CP01-S06/R08, CP01-S06/AC03, CP01-S06/AC04, CP01-S06/AC07, CP01-S07/R09, CP01-S07/AC03,
      CP01-S07/AC12, CP01-S08/AC01, CP01-S08/AC02, CP01-S08/AC08, CP01-S09/R05]
    question: "How does lifecycle policy declare the authority a Gate requires, and how are a Gate resolution and its actor recorded in execution state? Does a Gate resolution use the Decision actor syntax `<kind>:<identity>` with kind-only authorisation, or another authority model?"
  - id: Q23
    affects: [CP01-S06/R04, CP01-S06/AC07, CP01-S08/R05]
    question: "Core §28 leaves the storage path of lifecycle execution state to the implementation, but Core §56 makes the repository revision unavailable while non-ignored untracked files exist and requires written provenance to be committed before the next pinned run. Must execution state be ignored, committed or kept outside the repository so that ordinary lifecycle progress does not make the repository revision unavailable?"
  - id: Q24
    affects: [CP01-S06/R06, CP01-S09/R05]
    question: "Core §§23 and 28 leave the resolved-shape identity mechanism unresolved. What must execution state record to identify the resolved direct shape, and what do validation rules 9 (missing lifecycle shape) and 10 (unresolved or incompatible shape identity) check in Checkpoint 1?"
  - id: Q25
    affects: [CP01-S07/R09, CP01-S07/R10, CP01-S07/AC12, CP01-S09/R05]
    question: "How does the runtime identify the latest delivered state and detect a delivery change after Review (for example by repository revision, working-tree content or an execution-state counter), and where is the closing Review outcome recorded so that the closure guard can read it? Core §§32 and 52 fix no Review-result vocabulary."
  - id: Q26
    affects: [CP01-S08/R02, CP01-S08/R03, CP01-S08/AC01, CP01-S08/AC02]
    question: "Step 8 precedes Agent Pack capabilities (Step 10) and adapter commands (Step 12). What may `lifecycle run` dispatch at Step 8, and through which invocation seam? Do `status` and `next` name the Contract-crafting responsibilities (capture-intent, propose-contracts, approve-contract, write-brief) as lifecycle actions alongside shape steps, given that they are policy entries but not shape steps?"
  - id: Q27
    affects: [CP01-S08/R01, CP01-S08/R02, CP01-S08/R07]
    question: "Do `lifecycle status`, `next` and `run` operate on one selected Intent or Brief, or across every active direction? What is reported and run when several independent Intent directions are active at once?"
  - id: Q28
    affects: [CP01-S09/R04, CP01-S09/R06, CP01-S09/AC04, CP01-S09/AC05]
    question: "Which execution-provenance record, location and format do rule 17 and the historical policy check read? No Checkpoint 1 step before Step 9 writes execution provenance: do Step 9 fixtures define it, or does a later step own it? For a read-only `validate` of recorded provenance, what do a dirty input base and refusing without an attempt or replay record mean, given that validate performs no execution?"
  - id: Q29
    affects: [CP01-S09/R09, CP01-S09/R10, CP01-S09/AC08, CP01-S09/AC09]
    question: "Which records make up the default Delivery context's current relevant Contract/Brief lineage (for example the Intent, the current Decision and its rationale, or earlier Evidence)? How does a caller explicitly require excluded history, and how is included non-current history distinguished from current lineage? What namespace, ordering and size rules apply to Extension context contributions?"
  - id: Q30
    affects: [CP01-S09/R01, CP01-S09/R04, CP01-S09/R07, CP01-S09/AC04, CP01-S09/AC06]
    question: "What exit status and output contract does `pactwright validate` have: how are errors, warnings, inactive or unsupported components and unavailable verification (such as a historical policy or replay check) distinguished, and is machine-readable output required? Is a historical actor-kind incompatibility of a withdrawn Decision a validation failure or only a reported compatibility result? Core §57 names unavailable execution authority as a distinct diagnostic category: what makes authority unavailable, as distinct from an incomplete load of the lifecycle configuration?"
  - id: Q31
    affects: [CP01-S06/R08, CP01-S06/AC02, CP01-S07/R07, CP01-S07/AC04, CP01-S08/R01, CP01-S08/AC02]
    question: "Lifecycle `version: 1` defines `actor` only for approve-contract. What does `execution: manual` mean for deliver-brief, review and prepare-evidence, and what required actor does `lifecycle status` report for them? Do reject and defer Decisions use the approve-contract entry, as CP01-S07/AC04 assumes?"
  - id: Q32
    affects: [CP01-S06/R04, CP01-S08/R03]
    question: "Core §55 serialises canonical mutations only. How are writes to lifecycle execution state serialised when two `lifecycle run` invocations or Gate resolutions for the same Brief race, so that neither loses the other's progress or double-counts an iteration?"
  - id: Q33
    affects: [CP01-S08/R03, CP01-S09/R09, CP01-S12, CP01-S24]
    question: "Should the later contracts carry these obligations, which their version 20 prose does not state: Step 24 (or another later step) runs real Agent Pack capabilities through `lifecycle run`, beyond Step 8's instrumented invoker; and Agent Packs (Step 10) and the adapter (Step 12) consume the Step 9 context-assembly API rather than assembling context themselves?"
  - id: Q34
    affects: [CP01-S11/R01, CP01-S11/AC01, CP01-S11/AC04, CP01-S15, CP01-S17]
    question: "Step 11 requires `agent-pack use` to lock exact identity and run sync, but the resolved lock and `environment_lock_hash` arrive with Step 15, adapter rendering with Step 12 and deterministic sync with Step 17. What does Step 11 write to `.pactwright/lock.yml` and run as sync before those steps exist, and must Steps 15 and 17 repeat the selection and upgrade proofs through the real lock and sync?"
  - id: Q35
    affects: [CP01-S11/R01, CP01-S11/R08, CP01-S11/AC01, CP01-S11/AC04, CP01-S11/AC09]
    question: "Which source forms does `agent-pack use <source>` accept (package name, name with version or range, local path or tarball)? Must the package already be installed, as Step 23 installs packed artefacts first, or do `use` and `upgrade` delegate installation to the project package manager under Spec 02 section 15, whose package-manager detection is specified only at Step 19?"
  - id: Q36
    affects: [CP01-S10/R02, CP01-S10/R04, CP01-S10/AC01, CP01-S10/AC02, CP01-S11/AC02, CP01-S11/AC05]
    question: "Spec 02 section 5 describes Agent Pack content only conceptually. What format declares a pack's capability mappings, agents, prompts, direct skills and evaluation cases, and how does a pack declare its compatible runtime versions, so that the incompatible-runtime and capability-check criteria have a defined input?"
  - id: Q37
    affects: [CP01-S12/R07, CP01-S12/R08, CP01-S12/AC03]
    question: "The agent executing `/deliver-brief` or `/review` has write access to the repository. How does the runtime keep it from mutating the Delivery Graph directly: prevent the write, detect an out-of-band canonical change and refuse progression, or leave the change to `pactwright validate`? CP01-S12/AC03 assumes detection and refusal to advance."
  - id: Q38
    affects: [CP01-S12/R03, CP01-S12/R05, CP01-S12/R06, CP01-S12/R09, CP01-S12/R11, CP01-S12/AC02, CP01-S12/AC04]
    question: "Which capability does each adapter command invoke? Core section 35 assigns delivery-specification to Intent, alternatives, selection, Contract and Brief work, but names none for `/prepare-evidence`. How does a Claude Code command reach the runtime mutation API, given that CP01-S08 assumes no separate CLI mutation command and Principles section 11 lists no mutating runtime command for these responsibilities?"
  - id: Q39
    affects: [CP01-S13/R01, CP01-S13/R05, CP01-S13/AC01, CP01-S13/AC05]
    question: "How does `pactwright eval` execute capabilities and semantic judgement: live model calls through the adapter, a runtime-invoked provider, or recorded outputs? Which judge performs semantic assertions, how is it identified and pinned so that baseline and candidate results are comparable, and what does eval need when no model is available, as in CI?"
  - id: Q40
    affects: [CP01-S13/R02, CP01-S13/R06, CP01-S13/R07, CP01-S13/AC06, CP01-S13/AC07, CP01-S28]
    question: "What do `--baseline <released-pack-or-baseline>` and `--candidate <candidate-pack-or-environment>` accept (a package specifier, a stored evaluation result or a resolved lock/environment)? When is a case a regression, particularly for semantic results that vary between runs? Where are evaluation results written, and are they committed?"
