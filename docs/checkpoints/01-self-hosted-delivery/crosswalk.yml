open_questions:
  - id: Q01
    affects: [CP01-S01/R05, CP01-S02/R06, CP01-S03/R01]
    question: "Where does the loader find Pactwright configuration, lifecycle configuration, core records and typed edges, and in which serialisations? Must the layout stay readable by the released 0.0.1 runtime?"
  - id: Q02
    affects: [CP01-S01/R06, CP01-S02/AC05, CP01-S05/R02]
    question: "When an input cannot be parsed, does loading fail as a whole or return the parseable remainder with problems for validate (Step 9) and doctor (Step 18) to report? How are absent inputs and unrecognised files in graph storage treated?"
  - id: Q03
    affects: [CP01-S01/R05, CP01-S01/R07, CP01-S01/R08]
    question: "Should the Step 1 loader accept configuration that declares Extensions or enables GitHub as inert data, reject it, or report it as unsupported?"
  - id: Q04
    affects: [CP01-S01/R01]
    question: "Does the runtime package stay at the repository root or move to packages/pactwright/ as Spec 08 §4 and §6 describe?"
  - id: Q05
    affects: [CP01-S02/R06, CP01-S02/R07, CP01-S02/AC05]
    question: "What is a core record's canonical identity: how is it represented and assigned, is the record type part of it, and what makes one malformed? How is a changed identity of an existing record told apart from removing one record and adding another, and must it be rejected?"
  - id: Q06
    affects: [CP01-S02/R07, CP01-S03/R01]
    question: "What does immutability cover and what is it checked against: every stored record, including an unresolved Intent? The current stored graph or Git history? May a record or typed edge be removed or changed in place?"
  - id: Q07
    affects: [CP01-S02/R07, CP01-S05/R02]
    question: "Is a record's canonical content its stored bytes or a normalised form? Does a formatting-only edit count as an in-place change or change the Project Graph revision?"
  - id: Q08
    affects: [CP01-S02/R04]
    question: "Which items that Spec 01 says Intent, Contract, Brief and Evidence own are mandatory schema rules, and is each a structured field or prose? Are the content exclusions and qualities in Spec 01 §§7, 9, 10, 11 and 14 (what a record must not contain, a concise rationale) schema rules or review judgements?"
  - id: Q09
    affects: [CP01-S02/R05]
    question: "Does a Decision record only the kind of its authorised actor (human, agent, automation) or an actor identity as well?"
  - id: Q10
    affects: [CP01-S03/R03, CP01-S03/R05, CP01-S04/R01]
    question: "Does the core same-type supersedes relation apply to Intents and to Extension-owned node types, or do Extensions register their own supersession relations?"
  - id: Q11
    affects: [CP01-S03/R05, CP01-S04/R06]
    question: "Is branching supersession (one record superseded by several, or superseding several) illegal, and is it rejected by edge validation (Step 3), failed as ambiguous lineage (Step 4) or left to validation rule 8 (Step 9)?"
  - id: Q12
    affects: [CP01-S03/R06]
    question: "Beyond replacing a core relation's endpoint constraints, which registrations count as weakening core constraints, such as relaxing same-type or acyclicity rules or reusing a core relation name?"
  - id: Q13
    affects: [CP01-S03/R03, CP01-S05/R03]
    question: "How are stored edges of an unregistered relation treated, including preserved edges of a disabled or removed Extension: rejected, retained and excluded from the Project Graph revision, or reported?"
  - id: Q14
    affects: [CP01-S04/R01, CP01-S04/R06]
    question: "Are several unsuperseded Briefs for one current Contract, or several Evidence records for one current Brief, an ambiguous lineage or legitimate concurrent work?"
  - id: Q15
    affects: [CP01-S04/R02, CP01-S04/R06]
    question: "May a reject or defer Decision supersede a proceed Decision, and what is the status of the withdrawn proceed Decision's Contract, which has no same-type replacement?"
  - id: Q16
    affects: [CP01-S04/R02]
    question: "Must lineage derivation check a Decision's recorded actor against lifecycle policy, or is unauthorised-Decision detection left to Step 7 guards and Step 9 validation?"
  - id: Q17
    affects: [CP01-S05/R01, CP01-S05/AC01, CP01-S05/AC02]
    question: "Which repository state does the repository revision identify (commit, tree, or commit plus working tree), and how must it behave with uncommitted, untracked or ignored changes or without Git?"
  - id: Q18
    affects: [CP01-S05/R02, CP01-S05/R05]
    question: "Which hash algorithm and canonical serialisation does the Project Graph revision use, and must it be stable across runtime versions and platforms?"
  - id: Q19
    affects: [CP01-S05/R03]
    question: "Step 5 now needs a fixture registration seam for Extension-owned record types. Which step owns that seam (the Step 2 record model or Step 5), and how does Step 16 replace the fixture with installed Extensions?"
  - id: Q20
    affects: [CP01-S01/R05, CP01-S02/R07, CP01-S03/R06, CP01-S04/R01]
    question: "Should the later contracts carry these obligations, which v17 does not state at the named steps: Step 7 mutations refuse in-place rewrites through the Step 2 check; Step 16 re-runs CP01-S03/AC06 to AC09 and exercises Step 4 derivation through the fixture Extension loader, beyond the graph contribution registration and core-redefinition failure its v17 text already requires; Steps 6, 11, 14 and 15 load their real formats through the Step 1 loader?"
