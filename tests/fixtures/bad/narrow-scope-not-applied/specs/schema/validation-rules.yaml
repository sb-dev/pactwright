# Partial copy: the rules needed to reach class-market-quorum and
# comparison-required on a well-formed graph, in the canonical order.
rules:
  - id: nodes-required-fields
    kind: required_fields
    scope: nodes
  - id: edges-required-fields
    kind: required_fields
    scope: edges
  - id: nodes-type-declared
    kind: enum_constraint
    scope: nodes
    field: type
  - id: edges-type-declared
    kind: enum_constraint
    scope: edges
    field: type
  - id: nodes-id-unique
    kind: unique_field
    scope: nodes
    field: id
  - id: edges-id-unique
    kind: unique_field
    scope: edges
    field: id
  - id: nodes-status-in-enum
    kind: enum_constraint
    scope: nodes
    field: status
  - id: nodes-class-in-range
    kind: class_range
    scope: nodes
    types: [intent, contract]
    values: [0, 1, 2, 3]
  - id: edges-references-resolve
    kind: references_resolve
    scope: edges
    fields: [source, target]
  - id: edges-endpoint-types
    kind: edge_endpoint_types
  # The two rules under test. The selected contract declares `scope: narrow`, but
  # the intent is class 3 — the reduction is class-2-only, so BOTH must still fire.
  - id: class-market-quorum
    kind: class_market_quorum
  - id: comparison-required
    kind: comparison_required
  - id: indexes-fresh
    kind: indexes_fresh

# The selected contract is created after this, so comparison-required is in force
# (a pre-cutoff contract would be grandfathered and the fixture would prove nothing).
comparison_required_from: "2026-06-18"
