version: 2

responsibilities:
  capture-intent:
    execution: manual
  propose-contracts:
    execution: automatic
  approve-contract:
    execution: manual
    actor: human
  write-brief:
    execution: automatic
  publish:
    execution: automatic

shape:
  id: direct
  steps:
    - name: delivery
      kind: delivery
      execution: automatic
    - name: review
      kind: review
      execution: automatic
    - name: evidence
      kind: evidence
      execution: automatic
  transitions:
    - from: review
      to: delivery
      max_iterations: 3
