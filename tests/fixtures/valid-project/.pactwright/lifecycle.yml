version: 2

# Execution policy for the Contract-crafting responsibilities. These are not
# lifecycle-shape steps: they sit upstream of the Brief (Spec 01 §27).
responsibilities:
  capture-intent:
    execution: manual
  propose-contracts:
    execution: automatic
  approve-contract:
    execution: manual
    actor: human
  write-brief:
    execution: automatic

# The fulfilment shape governing Brief -> Evidence.
shape:
  id: direct
  steps:
    - name: delivery
      kind: delivery
      execution: automatic
    - name: review
      kind: review
      execution: automatic
    - name: evidence
      kind: evidence
      execution: automatic
  transitions:
    # A Review may route back to Delivery, bounded by policy (Spec 01 §34).
    - from: review
      to: delivery
      max_iterations: 3
