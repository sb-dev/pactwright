# T3.6 L4 comparison protocol (evidence-backed learning log §4, L4-03).
# Pinned before any comparison result: the driver records this file's digest
# in every result, and the report refuses results of another digest. Nothing
# here changes after results are seen; a change is a new protocol version,
# and the results of the old one are reported as they are.
version: 3

# The arms. B is the harness before T3.6; D and E are the revision under
# test, without and with learning. Each run is its own run directory and
# archive; no knowledge crosses runs.
baseline: cb6a0f76e2c3bfad9d2bc79fb482456e9ab05d19
arms:
  B: { tree: baseline, learning: false }
  D: { tree: current, learning: false }
  E: { tree: current, learning: true }

# Tuning tasks shake out the driver and fixtures, one of each held-out
# category; they tune no parameter and are never part of the decision.
# Held-out tasks decide. Repeat k runs the
# three arms back to back in the order rotate([B, D, E], k), from the same
# deterministic task repository.
sets:
  tuning:
    repeats: 1
    tasks: [cp80-slug, cp81-port, cp87-sign, cp88-words, cp89-rgb]
  held-out:
    repeats: 3
    tasks: [cp82-title, cp83-leap, cp84-flag, cp85-normalize, cp86-csv]

# The same settings for every arm. Injected attempts are the tasks' fixture
# faults, served by the same injector in every arm before any live attempt.
roles:
  producer:
    adapter: claude-sdk
    model: claude-sonnet-5
    effort: medium
    skills: [karpathy-guidelines]
    skill_digests:
      karpathy-guidelines: sha256:6e22cc54cb02a5e98ae42d06d9d7292db0c1b43894831b32879beb0166b2aea7
    max_turns: 40
  reviewer:
    adapter: claude-sdk
    model: claude-opus-5-5
    effort: medium
    skills: [code-review-and-quality]
    skill_digests:
      code-review-and-quality: sha256:8f3cabca581bbf7cb5f0add3f7454e7a4523f9d4353a6a4a217e6fa515309612
    max_turns: 30
credentials:
  kind: oauth-token
  provider: env:CLAUDE_CODE_OAUTH_TOKEN
# Every added learning call is charged to these, identical for every arm.
# The USD amounts are the harness's internal reservation unit, computed from
# the provider's API-price equivalent; they are not a bill.
budgets:
  attempts: 6
  retries: 4
  wall_time_seconds: 900
  provider_spend_limit:
    usd: 2
    turn_reservation_usd: 0.25
  run_spend_usd: 30
# Arm E only.
learning:
  reminder_chars: 400
  context:
    entries: 6
    guidance: 2
    bytes: 16384
  phases:
    exploration_rounds: 1
    check_timeout_seconds: 60
toolchain:
  node: "22"
  runner: ubuntu-24.04
  sdk: "0.3.283"

# How each run is scored, from its records and a hidden oracle that never
# enters the task repository. The oracle runs the accepted candidate in the
# containment image, without network, read-only.
#   valid             accepted, and the oracle passes
#   false-acceptance  accepted, and the oracle fails
#   exhausted         paused on an exhausted limit
#   paused            paused for any other reason
#   infrastructure    a provider, rate-limit or runner failure before acceptance
#   error             the driver could not run or read the run
# Usage is measured as live provider sessions, model turns, output tokens,
# uncached input tokens and wall-clock time; cache tokens are not recorded by
# the harness and are reported as not recorded. The SDK's cost is reported
# only as an API-price equivalent. Injected attempts count as attempts, never
# as sessions or usage. A repeated failed approach is a live attempt whose
# `correct` decision shares a finding rule with the previous attempt's.
decision:
  # Safety: no false acceptance by E, and the ordinary control task valid in
  # at least this many repeats of every arm.
  control: { task: cp82-title, valid_repeats: 2 }
  # Benefit of E over each of B and D, on held-out totals: valid outcomes up
  # by at least valid_margin, or repeated failed approaches at most
  # repeated_ratio of the other arm's (which has at least repeated_minimum)
  # with valid outcomes not lower; no held-out task with fewer valid
  # outcomes; median turns and median wall-clock time within these ratios;
  # and every planned (task, repeat) a complete pair of all three arms.
  valid_margin: 2
  repeated_ratio: 0.67
  repeated_minimum: 3
  turns_ratio: 2.5
  elapsed_ratio: 2.0
  # Regression: any false acceptance by E, or E's held-out valid total below
  # B's or D's. Anything else is inconclusive, with its reasons.

# A (task, repeat) whose run in any arm failed on infrastructure is run
# again as a whole, at most this many times; otherwise it is reported
# missing and left out of the paired totals, never replaced by another, and
# the set's result cannot be a benefit.
infrastructure:
  reruns: 2
# A shard (one task of a set) starts no further run once its runs used this
# many live sessions; the runs not started are reported missing.
stop:
  sessions_per_shard: 300
