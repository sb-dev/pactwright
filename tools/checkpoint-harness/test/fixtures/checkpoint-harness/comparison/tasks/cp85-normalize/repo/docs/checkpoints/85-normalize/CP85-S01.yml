# CP85 Step 1 — Write the normaliser
id: CP85-S01
requires: []
outputs:
  normalizer: >-
    The module `work/normalize.mjs` of TASK §1. It exports `normalize`. Run as a
    program with one argument, it prints the JSON encoding of its result for
    that argument and a newline, and exits 0.
requirements:
  R01:
    source: [TASK#1]
    statement: "The normaliser shall remove every leading and trailing whitespace character of a text, including tabs, line breaks and Unicode space separators, and replace each run of whitespace characters between two other characters with one space."
acceptance:
  AC01:
    covers: [R01]
    cases: [table]
    given: "Texts with leading, trailing and inner whitespace: single and repeated spaces, tabs, line breaks and Unicode space separators, and texts of whitespace only or empty."
    when: The module runs as a program with each text.
    then: "It prints the JSON string of each normalised text and exits 0."
    verify: {automated: [task.cases]}
