# CP87 Step 1 — Write the sign parser
id: CP87-S01
requires: []
outputs:
  sign: >-
    The module `work/sign.mjs` of TASK §1. It exports `parseSign`. Run as a
    program with one argument, it prints the JSON encoding of its result for
    that argument and a newline, and exits 0.
requirements:
  R01:
    source: [TASK#1]
    statement: "The sign parser shall return 1 for +, plus or positive and -1 for -, minus or negative, in any letter case, and null for any other text."
acceptance:
  AC01:
    covers: [R01]
    cases: [table]
    given: "Every sign word, each word of letters in at least two letter cases, and texts that are not signs: other words, prefixes, spaced words and the empty text."
    when: The module runs as a program with each text.
    then: "It prints the JSON 1, -1 or null for each text and exits 0."
    verify: {automated: [task.cases]}
