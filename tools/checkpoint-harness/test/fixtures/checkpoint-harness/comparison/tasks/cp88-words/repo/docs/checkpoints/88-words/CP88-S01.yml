# CP88 Step 1 — Write the word counter
id: CP88-S01
requires: []
outputs:
  counter: >-
    The module `work/words.mjs` of TASK §1. It exports `countWords`. Run as a
    program with one argument, it prints the JSON encoding of its result for
    that argument and a newline, and exits 0.
requirements:
  R01:
    source: [TASK#1]
    statement: "The word counter shall return the number of maximal runs of non-whitespace characters in a text, where whitespace includes spaces, tabs, line breaks and Unicode space separators."
acceptance:
  AC01:
    covers: [R01]
    cases: [table]
    given: "Texts with single and repeated spaces, tabs, line breaks and Unicode space separators between and around words, one word, and texts of whitespace only or empty."
    when: The module runs as a program with each text.
    then: "It prints the JSON word count of each text and exits 0."
    verify: {automated: [task.cases]}
