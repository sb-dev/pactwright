# CP96 Step 1 — Build the greeting
id: CP96-S01
requires: []
outputs:
  greeting: The greeting module `src/greet.mjs` of PROD §1.
requirements:
  R01:
    source: [PROD#1]
    statement: The greeting shall greet a name that is not empty once trimmed and reject any other.
acceptance:
  AC01:
    covers: [R01]
    cases: [named, blank]
    given: A name of the listed kind.
    when: The greeting program runs with it.
    then: It prints `Hello, Ada!` and exits 0 for the name Ada, and exits 1 without output for a blank name.
    verify: {automated: [greet.behaves]}
  AC02:
    covers: [R01]
    given: The greeting source.
    when: A reviewer inspects it.
    then: The greeting has one validation path.
    verify: {review: [greet.single-path]}
