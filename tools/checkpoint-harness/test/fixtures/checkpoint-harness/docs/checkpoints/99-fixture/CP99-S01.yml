# CP99 Step 1 — Parse the configuration
id: CP99-S01
requires: []
outputs:
  config-parser: >-
    A parser for the fixture configuration, `src/parser.mjs`. A configuration
    is a JSON object whose `name` is a non-empty string once trimmed. Run as a
    program the parser reads a configuration on stdin; it prints the parsed
    JSON and exits 0, or exits 1 with an error naming the field on stderr.
requirements:
  R01:
    source: [FIX#1]
    statement: The parser shall accept a valid configuration and reject an invalid one.
acceptance:
  AC01:
    covers: [R01]
    cases: [valid, invalid]
    given: A configuration of the listed kind.
    when: The parser program reads it on stdin.
    then: >-
      The parser accepts the valid one, printing its name and exiting 0, and
      rejects the invalid one, exiting 1 with an error that names the field.
    verify: {automated: [parser.accepts, parser.rejects]}
  AC02:
    covers: [R01]
    given: The parser source.
    when: A reviewer inspects it.
    then: The parser has one validation path.
    verify: {review: [parser.single-path]}
